<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برج ۳۰ - Survival Horror</title>
<style>
/* ===== استایل‌های اصلی بازی ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; cursor: none; }
#gameCanvas { width: 100vw; height: 100vh; display: block; }

/* ===== کراس‌هیر ===== */
#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 24px; height: 24px; pointer-events: none; z-index: 100;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.7);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

/* ===== گوشی هوشمند (Diegetic UI) ===== */
#smartphone {
  position: fixed; bottom: -300px; right: 30px; width: 200px; height: 360px;
  background: #111; border-radius: 20px; border: 3px solid #333;
  z-index: 200; transition: bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
#smartphone.active { bottom: 20px; }
#phoneScreen {
  width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
  padding: 15px; color: #0f0; font-size: 11px; overflow-y: auto;
  font-family: 'Courier New', monospace; direction: rtl;
}
#phoneScreen::-webkit-scrollbar { width: 3px; }
#phoneScreen::-webkit-scrollbar-thumb { background: #0f0; border-radius: 3px; }
.phone-header {
  text-align: center; padding: 8px; border-bottom: 1px solid #0f03;
  margin-bottom: 10px; font-size: 10px; color: #0a0;
}
.phone-msg {
  background: rgba(0,255,0,0.05); border: 1px solid #0f03;
  border-radius: 8px; padding: 8px; margin: 6px 0;
  animation: msgAppear 0.5s ease-out;
}
@keyframes msgAppear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.phone-msg .sender { color: #f80; font-size: 9px; margin-bottom: 3px; }
.phone-msg .text { color: #0f0; line-height: 1.4; }
.phone-time { color: #0a0; font-size: 8px; text-align: center; margin-top: 10px; }

/* ===== HUD مینیمال ===== */
#hud {
  position: fixed; bottom: 30px; left: 30px; z-index: 150;
  pointer-events: none;
}
.hud-bar {
  width: 200px; height: 6px; background: rgba(255,255,255,0.1);
  border-radius: 3px; margin: 4px 0; overflow: hidden;
}
.hud-bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.3s;
}
#healthBar .hud-bar-fill { background: linear-gradient(90deg, #f00, #f44); width: 100%; }
#staminaBar .hud-bar-fill { background: linear-gradient(90deg, #0af, #4cf); width: 100%; }
.hud-label { color: rgba(255,255,255,0.5); font-size: 10px; margin-bottom: 2px; }

/* ===== اطلاعات طبقه ===== */
#floorInfo {
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.6); font-size: 14px; z-index: 150;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none;
  letter-spacing: 3px;
}

/* ===== منوی شروع ===== */
#startMenu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #0a0a0a, #1a0a0a);
  z-index: 1000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
#startMenu h1 {
  font-size: 72px; color: #fff; text-shadow: 0 0 30px rgba(255,50,50,0.5);
  margin-bottom: 10px; letter-spacing: 8px;
}
#startMenu .subtitle {
  color: rgba(255,255,255,0.4); font-size: 16px; margin-bottom: 50px;
  letter-spacing: 5px;
}
#startBtn {
  padding: 15px 60px; font-size: 18px; background: transparent;
  border: 2px solid rgba(255,255,255,0.3); color: #fff;
  cursor: pointer; letter-spacing: 3px; transition: all 0.3s;
  border-radius: 4px;
}
#startBtn:hover {
  background: rgba(255,50,50,0.2); border-color: #f33;
  box-shadow: 0 0 30px rgba(255,50,50,0.3);
}
#continueBtn {
  padding: 10px 40px; font-size: 14px; background: transparent;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
  cursor: pointer; margin-top: 15px; letter-spacing: 2px;
  border-radius: 4px; transition: all 0.3s;
}
#continueBtn:hover { border-color: #0f0; color: #0f0; }

/* ===== لودینگ ===== */
#loadingScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 2000; display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
#loadingBar {
  width: 300px; height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; overflow: hidden; margin-top: 20px;
}
#loadingBarFill {
  width: 0%; height: 100%; background: #f33;
  transition: width 0.3s; border-radius: 2px;
}
#loadingText { color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 3px; }

/* ===== راهنمای کنترل ===== */
#controls {
  position: fixed; bottom: 30px; right: 30px; z-index: 150;
  color: rgba(255,255,255,0.3); font-size: 10px; pointer-events: none;
  text-align: right; line-height: 1.8;
}

/* ===== افکت آسیب ===== */
#damageOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 90; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.4) 100%);
  transition: opacity 0.3s;
}

/* ===== ساعت بازی ===== */
#gameClock {
  position: fixed; top: 30px; right: 30px; z-index: 150;
  color: rgba(255,255,255,0.4); font-size: 12px; pointer-events: none;
  font-family: 'Courier New', monospace;
}
</style>
</head>
<body>

<!-- منوی شروع -->
<div id="startMenu">
  <h1>TOWER 30</h1>
  <div class="subtitle">بقا در برج سی طبقه</div>
  <button id="startBtn" onclick="startNewGame()">شروع بازی جدید</button>
  <button id="continueBtn" onclick="continueGame()" style="display:none;">ادامه بازی</button>
</div>

<!-- صفحه لودینگ -->
<div id="loadingScreen">
  <div id="loadingText">در حال بارگذاری...</div>
  <div id="loadingBar"><div id="loadingBarFill"></div></div>
</div>

<!-- Canvas بازی -->
<canvas id="gameCanvas"></canvas>

<!-- کراس‌هیر -->
<div id="crosshair"></div>

<!-- افکت آسیب -->
<div id="damageOverlay"></div>

<!-- اطلاعات طبقه -->
<div id="floorInfo">طبقه ۳۰ — آپارتمان شما</div>

<!-- ساعت بازی -->
<div id="gameClock">۰۰:۰۰</div>

<!-- گوشی هوشمند -->
<div id="smartphone">
  <div id="phoneScreen">
    <div class="phone-header">📱 پیام‌ها — ناشناس</div>
    <div id="phoneMessages"></div>
    <div class="phone-time" id="phoneTime"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-label">سلامت</div>
  <div class="hud-bar" id="healthBar"><div class="hud-bar-fill"></div></div>
  <div class="hud-label">استامینا</div>
  <div class="hud-bar" id="staminaBar"><div class="hud-bar-fill"></div></div>
</div>

<!-- راهنما -->
<div id="controls">
  WASD — حرکت | Shift — دویدن<br>
  Mouse — نگاه | F — چراغ‌قوه<br>
  E — تعامل | Tab — کوله‌پشتی<br>
  H — گوشی | ESC — منو
</div>

<!-- Three.js و افزونه‌ها از CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== متغیرهای سراسری =====
let scene, camera, renderer, composer;
let clock = new THREE.Clock();
let playerState = {
  health: 100, stamina: 100, floor: 30,
  isRunning: false, flashlightOn: true,
  gameStarted: false, gameTime: 0,
  position: new THREE.Vector3(0, 1.7, 0),
  rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
  velocity: new THREE.Vector3(),
  inCasualClothes: true // شروع با لباس خانگی
};
let keys = {};
let mouseMovement = { x: 0, y: 0 };
let isPointerLocked = false;
let flashlight, flashlightTarget;
let particles = [];
let phoneMessages = [];
let gameSaved = false;

// ===== شیدرهای سفارشی =====
const CustomShader = {
  uniforms: {
    tDiffuse: { value: null },
    time: { value: 0 },
    intensity: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float intensity;
    varying vec2 vUv;
    
    // نویز فیلم
    float random(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
    }
    
    void main() {
      vec2 uv = vUv;
      
      // انحراف رنگی (Chromatic Aberration)
      float dist = distance(uv, vec2(0.5));
      float aberration = dist * 0.003 * intensity;
      vec4 cr = texture2D(tDiffuse, uv + vec2(aberration, 0.0));
      vec4 cg = texture2D(tDiffuse, uv);
      vec4 cb = texture2D(tDiffuse, uv - vec2(aberration, 0.0));
      vec4 color = vec4(cr.r, cg.g, cb.b, 1.0);
      
      // نویز فیلم (Film Grain)
      float grain = random(uv * time) * 0.04 - 0.02;
      color.rgb += grain;
      
      // وینیت (Vignette)
      float vignette = 1.0 - dist * 0.8;
      color.rgb *= vignette;
      
      // کمی کاهش اشباع برای حس سینمایی
      float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
      color.rgb = mix(vec3(lum), color.rgb, 0.85);
      
      gl_FragColor = color;
    }
  `
};

// ===== راه‌اندازی موتور =====
function initEngine() {
  // رندرر WebGL2
  const canvas = document.getElementById('gameCanvas');
  renderer = new THREE.WebGLRenderer({ 
    canvas, antialias: false, powerPreference: 'high-performance' 
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.physicallyCorrectLights = true;

  // صحنه
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a15, 0.02);
  scene.background = new THREE.Color(0x050510);

  // دوربین
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(playerState.position);

  // PMREM برای بازتاب‌ها
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();

  // ===== نورپردازی =====
  // نور نیم‌کره (آسمان/زمین)
  const hemiLight = new THREE.HemisphereLight(0x1a1a3e, 0x0a0a0a, 0.3);
  scene.add(hemiLight);

  // نور محیطی از پنجره (نور شهر)
  const windowLight = new THREE.DirectionalLight(0x4466aa, 0.5);
  windowLight.position.set(10, 5, -10);
  windowLight.castShadow = true;
  windowLight.shadow.mapSize.set(4096, 4096);
  windowLight.shadow.camera.near = 0.1;
  windowLight.shadow.camera.far = 50;
  windowLight.shadow.camera.left = -15;
  windowLight.shadow.camera.right = 15;
  windowLight.shadow.camera.top = 15;
  windowLight.shadow.camera.bottom = -15;
  windowLight.shadow.bias = -0.0001;
  scene.add(windowLight);

  // چراغ‌قوه بازیکن
  flashlight = new THREE.SpotLight(0xffeedd, 3, 20, Math.PI / 6, 0.5, 1);
  flashlight.castShadow = true;
  flashlight.shadow.mapSize.set(2048, 2048);
  flashlight.shadow.bias = -0.0001;
  flashlight.position.copy(camera.position);
  scene.add(flashlight);
  
  flashlightTarget = new THREE.Object3D();
  flashlightTarget.position.set(0, 0, -1);
  scene.add(flashlightTarget);
  flashlight.target = flashlightTarget;

  // ===== پس‌پردازش =====
  composer = new EffectComposer(renderer);
  
  // رندر پایه
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  // بلوم (درخشش)
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.5, 0.4, 0.85
  );
  composer.addPass(bloomPass);

  // SMAA آنتی‌آلیاسینگ
  const smaaPass = new SMAAPass(window.innerWidth, window.innerHeight);
  composer.addPass(smaaPass);

  // شیدر سفارشی (Chromatic Aberration + Film Grain + Vignette)
  const customPass = new ShaderPass(CustomShader);
  composer.addPass(customPass);

  // Output Pass
  const outputPass = new OutputPass();
  composer.addPass(outputPass);

  // ===== ساخت طبقه ۳۰ =====
  buildFloor30();

  // ===== ذرات گرد و غبار =====
  createDustParticles();

  // ===== رویدادها =====
  setupEvents();

  // بررسی ذخیره قبلی
  checkSaveData();
}

// ===== ساخت طبقه ۳۰ (آپارتمان بازیکن) =====
function buildFloor30() {
  const floorGroup = new THREE.Group();
  floorGroup.name = 'floor30';

  // متریال‌های PBR
  const wallMat = new THREE.MeshPhysicalMaterial({
    color: 0x8a8a7a, roughness: 0.8, metalness: 0.0,
    clearcoat: 0.1, clearcoatRoughness: 0.8
  });
  
  const floorMat = new THREE.MeshPhysicalMaterial({
    color: 0x3a2a1a, roughness: 0.6, metalness: 0.0,
    clearcoat: 0.3, clearcoatRoughness: 0.4
  });

  const ceilingMat = new THREE.MeshPhysicalMaterial({
    color: 0x9a9a8a, roughness: 0.9, metalness: 0.0
  });

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x88aacc, roughness: 0.0, metalness: 0.1,
    transmission: 0.9, thickness: 0.1, ior: 1.5,
    transparent: true, opacity: 0.3
  });

  const furnitureMat = new THREE.MeshPhysicalMaterial({
    color: 0x2a1a0a, roughness: 0.7, metalness: 0.0,
    clearcoat: 0.2
  });

  const metalMat = new THREE.MeshPhysicalMaterial({
    color: 0x888888, roughness: 0.3, metalness: 0.8,
    clearcoat: 0.5
  });

  // کف آپارتمان
  const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 10), floorMat);
  floor.position.set(0, 0, 0);
  floor.receiveShadow = true;
  floorGroup.add(floor);

  // سقف
  const ceiling = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 10), ceilingMat);
  ceiling.position.set(0, 3, 0);
  ceiling.receiveShadow = true;
  floorGroup.add(ceiling);

  // دیوارها
  const walls = [
    { pos: [0, 1.5, -5], size: [12, 3, 0.2] },   // پشت
    { pos: [0, 1.5, 5], size: [12, 3, 0.2] },     // جلو
    { pos: [-6, 1.5, 0], size: [0.2, 3, 10] },    // چپ
    { pos: [6, 1.5, 0], size: [0.2, 3, 10] },     // راست
  ];

  walls.forEach(w => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(...w.size), wallMat);
    wall.position.set(...w.pos);
    wall.castShadow = true;
    wall.receiveShadow = true;
    floorGroup.add(wall);
  });

  // پنجره بزرگ (نمای شهر)
  const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 0.1), metalMat);
  windowFrame.position.set(0, 1.5, -4.9);
  floorGroup.add(windowFrame);

  const windowGlass = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.3, 0.05), glassMat);
  windowGlass.position.set(0, 1.5, -4.95);
  floorGroup.add(windowGlass);

  // مبلمان - مبل
  const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 1), furnitureMat);
  sofa.position.set(-3, 0.5, 2);
  sofa.castShadow = true;
  sofa.receiveShadow = true;
  floorGroup.add(sofa);

  const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 0.2), furnitureMat);
  sofaBack.position.set(-3, 1.0, 2.5);
  sofaBack.castShadow = true;
  floorGroup.add(sofaBack);

  // میز
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 0.8), furnitureMat);
  table.position.set(-3, 0.7, 0.5);
  table.castShadow = true;
  table.receiveShadow = true;
  floorGroup.add(table);

  const tableLegs = [
    [-3.6, 0.35, 0.2], [-3.6, 0.35, 0.8],
    [-2.4, 0.35, 0.2], [-2.4, 0.35, 0.8]
  ];
  tableLegs.forEach(pos => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.7), metalMat);
    leg.position.set(...pos);
    leg.castShadow = true;
    floorGroup.add(leg);
  });

  // تلویزیون
  const tv = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1, 0.05), new THREE.MeshPhysicalMaterial({
    color: 0x111111, roughness: 0.1, metalness: 0.5, clearcoat: 1.0
  }));
  tv.position.set(3, 1.2, -4.5);
  tv.castShadow = true;
  floorGroup.add(tv);

  // صفحه تلویزیون (نور ضعیف)
  const tvScreen = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.9, 0.01), 
    new THREE.MeshBasicMaterial({ color: 0x112233 }));
  tvScreen.position.set(3, 1.2, -4.47);
  floorGroup.add(tvScreen);

  // نور تلویزیون
  const tvLight = new THREE.PointLight(0x2244aa, 0.5, 5);
  tvLight.position.set(3, 1.2, -4);
  floorGroup.add(tvLight);

  // کابینت آشپزخانه
  const cabinet = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.6), furnitureMat);
  cabinet.position.set(4, 1, 3);
  cabinet.castShadow = true;
  cabinet.receiveShadow = true;
  floorGroup.add(cabinet);

  // یخچال
  const fridge = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.7), metalMat);
  fridge.position.set(5.3, 1, 3);
  fridge.castShadow = true;
  floorGroup.add(fridge);

  // چراغ سقفی
  const ceilingLight = new THREE.PointLight(0xffeedd, 0.8, 8);
  ceilingLight.position.set(0, 2.8, 0);
  ceilingLight.castShadow = true;
  floorGroup.add(ceilingLight);

  const lampFixture = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
    metalMat
  );
  lampFixture.position.set(0, 2.9, 0);
  floorGroup.add(lampFixture);

  // درب ورودی
  const door = new THREE.Mesh(new THREE.BoxGeometry(1, 2.2, 0.1), 
    new THREE.MeshPhysicalMaterial({ color: 0x4a3a2a, roughness: 0.6, metalness: 0.1 }));
  door.position.set(0, 1.1, 4.9);
  door.castShadow = true;
  floorGroup.add(door);

  const doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), metalMat);
  doorHandle.position.set(0.35, 1.1, 4.95);
  floorGroup.add(doorHandle);

  // فرش
  const rug = new THREE.Mesh(new THREE.BoxGeometry(3, 0.02, 2), 
    new THREE.MeshPhysicalMaterial({ color: 0x8a2a2a, roughness: 0.9 }));
  rug.position.set(-1, 0.11, 1);
  rug.receiveShadow = true;
  floorGroup.add(rug);

  // گلدان
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.3, 8), 
    new THREE.MeshPhysicalMaterial({ color: 0x8a4a2a, roughness: 0.8 }));
  pot.position.set(2, 0.25, -3);
  pot.castShadow = true;
  floorGroup.add(pot);

  const plant = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshPhysicalMaterial({ color: 0x2a5a1a, roughness: 0.8 }));
  plant.position.set(2, 0.5, -3);
  plant.castShadow = true;
  floorGroup.add(plant);

  // نمای شهر از پنجره (ساختمان‌های دور)
  createCityView(floorGroup);

  scene.add(floorGroup);
}

// ===== نمای شهر از پنجره =====
function createCityView(parent) {
  const buildingMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a1a2a, roughness: 0.7, metalness: 0.3
  });

  for (let i = 0; i < 20; i++) {
    const h = 2 + Math.random() * 8;
    const w = 0.5 + Math.random() * 1.5;
    const d = 0.5 + Math.random() * 1.5;
    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    building.position.set(
      -15 + Math.random() * 30,
      -h/2 - 2,
      -20 - Math.random() * 30
    );
    building.castShadow = true;
    parent.add(building);

    // پنجره‌های روشن در ساختمان‌ها
    if (Math.random() > 0.5) {
      const winLight = new THREE.PointLight(0xffaa44, 0.3, 3);
      winLight.position.set(
        building.position.x,
        building.position.y + h * 0.3,
        building.position.z + d/2 + 0.1
      );
      parent.add(winLight);
    }
  }

  // آسمان شب
  const skyGeo = new THREE.SphereGeometry(100, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({
    color: 0x050515, side: THREE.BackSide
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  parent.add(sky);

  // ماه
  const moon = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xeeeedd }));
  moon.position.set(20, 30, -50);
  parent.add(moon);

  // نور ماه
  const moonLight = new THREE.DirectionalLight(0x4466aa, 0.2);
  moonLight.position.set(20, 30, -50);
  parent.add(moonLight);
}

// ===== ذرات گرد و غبار =====
function createDustParticles() {
  const particleCount = 500;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 12;
    positions[i * 3 + 1] = Math.random() * 3;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
    velocities.push({
      x: (Math.random() - 0.5) * 0.002,
      y: (Math.random() - 0.5) * 0.001,
      z: (Math.random() - 0.5) * 0.002
    });
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: 0xffffff, size: 0.02, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending
  });

  const particleSystem = new THREE.Points(geometry, material);
  particleSystem.userData.velocities = velocities;
  scene.add(particleSystem);
  particles.push(particleSystem);
}

// ===== سیستم رویدادها =====
function setupEvents() {
  document.addEventListener('keydown', e => { keys[e.code] = true; });
  document.addEventListener('keyup', e => { keys[e.code] = false; });
  
  document.addEventListener('mousemove', e => {
    if (isPointerLocked) {
      mouseMovement.x += e.movementX;
      mouseMovement.y += e.movementY;
    }
  });

  document.addEventListener('pointerlockchange', () => {
    isPointerLocked = document.pointerLockElement === document.getElementById('gameCanvas');
  });

  document.getElementById('gameCanvas').addEventListener('click', () => {
    if (playerState.gameStarted && !isPointerLocked) {
      document.getElementById('gameCanvas').requestPointerLock();
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ===== بررسی داده ذخیره =====
function checkSaveData() {
  const saveData = localStorage.getItem('tower30_save');
  if (saveData) {
    document.getElementById('continueBtn').style.display = 'block';
  }
}

// ===== شروع بازی جدید =====
window.startNewGame = function() {
  document.getElementById('startMenu').style.display = 'none';
  showLoading();
  
  setTimeout(() => {
    playerState.gameStarted = true;
    playerState.inCasualClothes = true;
    playerState.health = 100;
    playerState.stamina = 100;
    playerState.floor = 30;
    playerState.gameTime = 0;
    
    document.getElementById('gameCanvas').requestPointerLock();
    addPhoneMessage('ناشناس', 'بیدار شو... وقت نداریم. برق تا ۴ ساعت دیگه قطع میشه.');
    setTimeout(() => addPhoneMessage('ناشناس', 'سگت شرمَن کنارته. مراقبش باش.'), 3000);
    setTimeout(() => addPhoneMessage('ناشناس', 'از پله‌ها بیا پایین. طبقه به طبقه. مراقب صدا باش.'), 6000);
    setTimeout(() => addPhoneMessage('ناشناس', 'لباس رزمیت توی کمد اتاق خوابه. عجله کن.'), 9000);
    
    hideLoading();
  }, 2000);
};

// ===== ادامه بازی =====
window.continueGame = function() {
  const saveData = JSON.parse(localStorage.getItem('tower30_save'));
  if (saveData) {
    playerState = { ...playerState, ...saveData };
    playerState.position = new THREE.Vector3(...saveData.position);
    playerState.velocity = new THREE.Vector3(...saveData.velocity);
  }
  document.getElementById('startMenu').style.display = 'none';
  playerState.gameStarted = true;
  document.getElementById('gameCanvas').requestPointerLock();
  document.getElementById('floorInfo').textContent = `طبقه ${playerState.floor}`;
}

// ===== لودینگ =====
function showLoading() {
  const ls = document.getElementById('loadingScreen');
  ls.style.display = 'flex';
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
    }
    document.getElementById('loadingBarFill').style.width = progress + '%';
  }, 200);
}

function hideLoading() {
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
  }, 500);
}

// ===== پیام گوشی =====
function addPhoneMessage(sender, text) {
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  
  phoneMessages.push({ sender, text, time: timeStr });
  
  const msgDiv = document.createElement('div');
  msgDiv.className = 'phone-msg';
  msgDiv.innerHTML = `<div class="sender">${sender} — ${timeStr}</div><div class="text">${text}</div>`;
  
  const container = document.getElementById('phoneMessages');
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;
  
  document.getElementById('phoneTime').textContent = timeStr;
  
  // نمایش گوشی
  document.getElementById('smartphone').classList.add('active');
  setTimeout(() => {
    if (!keys['KeyH']) {
      document.getElementById('smartphone').classList.remove('active');
    }
  }, 5000);
}

// ===== به‌روزرسانی بازیکن =====
function updatePlayer(delta) {
  if (!playerState.gameStarted) return;

  // چرخش دوربین
  const sensitivity = 0.002;
  playerState.rotation.y -= mouseMovement.x * sensitivity;
  playerState.rotation.x -= mouseMovement.y * sensitivity;
  playerState.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, playerState.rotation.x));
  mouseMovement.x = 0;
  mouseMovement.y = 0;

  camera.rotation.copy(playerState.rotation);

  // حرکت
  const speed = keys['ShiftLeft'] ? 8 : 4;
  const direction = new THREE.Vector3();
  
  if (keys['KeyW']) direction.z -= 1;
  if (keys['KeyS']) direction.z += 1;
  if (keys['KeyA']) direction.x -= 1;
  if (keys['KeyD']) direction.x += 1;
  
  direction.normalize();
  direction.applyEuler(new THREE.Euler(0, playerState.rotation.y, 0));
  
  playerState.velocity.x = direction.x * speed;
  playerState.velocity.z = direction.z * speed;

  // اعمال حرکت
  camera.position.x += playerState.velocity.x * delta;
  camera.position.z += playerState.velocity.z * delta;

  // محدودیت حرکت در آپارتمان
  camera.position.x = Math.max(-5.5, Math.min(5.5, camera.position.x));
  camera.position.z = Math.max(-4.5, Math.min(4.5, camera.position.z));
  camera.position.y = 1.7;

  // Camera Bob هنگام حرکت
  if (direction.length() > 0) {
    const bobSpeed = keys['ShiftLeft'] ? 12 : 8;
    const bobAmount = keys['ShiftLeft'] ? 0.05 : 0.03;
    camera.position.y += Math.sin(clock.elapsedTime * bobSpeed) * bobAmount;
  }

  // استامینا
  if (keys['ShiftLeft'] && direction.length() > 0) {
    playerState.stamina = Math.max(0, playerState.stamina - 20 * delta);
    playerState.isRunning = true;
  } else {
    playerState.stamina = Math.min(100, playerState.stamina + 10 * delta);
    playerState.isRunning = false;
  }

  // چراغ‌قوه
  if (keys['KeyF']) {
    playerState.flashlightOn = !playerState.flashlightOn;
    keys['KeyF'] = false;
  }
  
  flashlight.visible = playerState.flashlightOn;
  flashlight.position.copy(camera.position);
  flashlightTarget.position.copy(camera.position);
  flashlightTarget.position.add(new THREE.Vector3(
    Math.sin(playerState.rotation.y) * Math.cos(playerState.rotation.x),
    Math.sin(playerState.rotation.x),
    -Math.cos(playerState.rotation.y) * Math.cos(playerState.rotation.x)
  ).multiplyScalar(5));

  // گوشی
  if (keys['KeyH']) {
    document.getElementById('smartphone').classList.add('active');
  } else {
    document.getElementById('smartphone').classList.remove('active');
  }

  // به‌روزرسانی HUD
  document.querySelector('#healthBar .hud-bar-fill').style.width = playerState.health + '%';
  document.querySelector('#staminaBar .hud-bar-fill').style.width = playerState.stamina + '%';

  // ساعت بازی
  playerState.gameTime += delta;
  const mins = Math.floor(playerState.gameTime / 60);
  const secs = Math.floor(playerState.gameTime % 60);
  document.getElementById('gameClock').textContent = 
    `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

  // ذخیره خودکار هر ۳۰ ثانیه
  if (Math.floor(playerState.gameTime) % 30 === 0 && Math.floor(playerState.gameTime) > 0) {
    saveGame();
  }
}

// ===== ذخیره بازی =====
function saveGame() {
  const saveData = {
    health: playerState.health,
    stamina: playerState.stamina,
    floor: playerState.floor,
    gameTime: playerState.gameTime,
    inCasualClothes: playerState.inCasualClothes,
    position: [camera.position.x, camera.position.y, camera.position.z],
    velocity: [playerState.velocity.x, playerState.velocity.y, playerState.velocity.z],
    rotation: [playerState.rotation.x, playerState.rotation.y, playerState.rotation.z]
  };
  localStorage.setItem('tower30_save', JSON.stringify(saveData));
  gameSaved = true;
}

// ===== به‌روزرسانی ذرات =====
function updateParticles(delta) {
  particles.forEach(ps => {
    const positions = ps.geometry.attributes.position.array;
    const vels = ps.userData.velocities;
    
    for (let i = 0; i < vels.length; i++) {
      positions[i * 3] += vels[i].x;
      positions[i * 3 + 1] += vels[i].y;
      positions[i * 3 + 2] += vels[i].z;
      
      // بازگرداندن ذرات به محدوده
      if (Math.abs(positions[i * 3]) > 6) positions[i * 3] *= -0.9;
      if (positions[i * 3 + 1] > 3 || positions[i * 3 + 1] < 0) vels[i].y *= -1;
      if (Math.abs(positions[i * 3 + 2]) > 5) positions[i * 3 + 2] *= -0.9;
    }
    
    ps.geometry.attributes.position.needsUpdate = true;
  });
}

// ===== حلقه اصلی بازی =====
function animate() {
  requestAnimationFrame(animate);
  
  const delta = Math.min(clock.getDelta(), 0.05);
  
  updatePlayer(delta);
  updateParticles(delta);
  
  // به‌روزرسانی شیدر سفارشی
  composer.passes.forEach(pass => {
    if (pass.uniforms && pass.uniforms.time) {
      pass.uniforms.time.value = clock.elapsedTime;
    }
  });
  
  composer.render();
}

// ===== شروع =====
initEngine();
animate();

</script>
