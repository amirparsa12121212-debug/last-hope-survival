<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>برج ۳۰ - Survival Horror</title>
<style>
/* ===== استایل‌های پایه ===== */
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent; 
  user-select: none; 
  -webkit-user-select: none; 
  touch-action: none; 
}
html, body { 
  width: 100%; 
  height: 100%; 
  overflow: hidden; 
  background: #000; 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  cursor: none; 
  position: fixed; 
}
#gameCanvas { 
  width: 100vw; 
  height: 100vh; 
  display: block; 
  position: absolute; 
  top: 0; 
  left: 0; 
}

/* ===== کراس‌هیر ===== */
#crosshair {
  position: fixed; 
  top: 50%; 
  left: 50%; 
  transform: translate(-50%, -50%);
  width: 20px; 
  height: 20px; 
  pointer-events: none; 
  z-index: 100;
}
#crosshair::before, #crosshair::after {
  content: ''; 
  position: absolute; 
  background: rgba(255,255,255,0.6);
}
#crosshair::before { 
  width: 2px; 
  height: 100%; 
  left: 50%; 
  transform: translateX(-50%); 
}
#crosshair::after { 
  height: 2px; 
  width: 100%; 
  top: 50%; 
  transform: translateY(-50%); 
}

/* ===== جوی‌استیک مجازی ===== */
#joystickZone {
  position: fixed; 
  bottom: 0; 
  left: 0; 
  width: 45%; 
  height: 45%;
  z-index: 150; 
  pointer-events: none;
}
#joystickBase {
  position: absolute; 
  width: 120px; 
  height: 120px;
  border-radius: 50%; 
  background: rgba(255,255,255,0.08);
  border: 3px solid rgba(255,255,255,0.2);
  display: none; 
  pointer-events: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#joystickThumb {
  position: absolute; 
  width: 55px; 
  height: 55px;
  border-radius: 50%; 
  background: rgba(255,255,255,0.3);
  border: 3px solid rgba(255,255,255,0.5);
  top: 50%; 
  left: 50%; 
  transform: translate(-50%, -50%);
  pointer-events: none;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* ===== منطقه نگاه ===== */
#lookZone {
  position: fixed; 
  top: 0; 
  right: 0; 
  width: 55%; 
  height: 70%;
  z-index: 140; 
  pointer-events: none;
}

/* ===== دکمه‌های لمسی ===== */
.touchBtn {
  position: fixed; 
  z-index: 160;
  width: 65px; 
  height: 65px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  color: #fff; 
  font-size: 22px;
  display: flex; 
  align-items: center; 
  justify-content: center;
  pointer-events: auto;
  transition: all 0.15s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.touchBtn:active, .touchBtn.active {
  background: rgba(255,255,255,0.3);
  border-color: rgba(255,255,255,0.6);
  transform: scale(0.9);
  box-shadow: 0 0 20px rgba(255,255,255,0.4);
}
.touchBtn .label {
  position: absolute; 
  bottom: -20px;
  font-size: 10px; 
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
  text-shadow: 0 2px 5px rgba(0,0,0,0.8);
}

#btnFlashlight { bottom: 200px; right: 25px; }
#btnPhone { bottom: 130px; right: 25px; }
#btnInteract { bottom: 60px; right: 25px; }
#btnRun { bottom: 200px; left: 140px; width: 60px; height: 60px; font-size: 18px; }
#btnCrouch { bottom: 130px; left: 140px; width: 60px; height: 60px; font-size: 18px; }

/* ===== گوشی هوشمند ===== */
#smartphone {
  position: fixed; 
  bottom: -380px; 
  right: 15px; 
  width: 180px; 
  height: 320px;
  background: linear-gradient(135deg, #1a1a1a, #0a0a0a); 
  border-radius: 20px; 
  border: 3px solid #555;
  z-index: 200; 
  transition: bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden; 
  box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0,255,0,0.15);
}
#smartphone.active { bottom: 15px; }

#phoneCloseBtn {
  position: absolute; 
  top: 8px; 
  left: 8px;
  width: 28px; 
  height: 28px;
  border-radius: 50%;
  background: rgba(255,50,50,0.9);
  border: 2px solid rgba(255,100,100,0.5);
  color: #fff;
  font-size: 16px;
  display: flex; 
  align-items: center; 
  justify-content: center;
  cursor: pointer;
  z-index: 210;
  pointer-events: auto;
  transition: all 0.2s;
  box-shadow: 0 2px 10px rgba(255,0,0,0.4);
}
#phoneCloseBtn:active {
  background: rgba(255,50,50,1);
  transform: scale(0.85);
}

#phoneScreen {
  width: 100%; 
  height: 100%; 
  background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
  padding: 12px; 
  color: #0f0; 
  font-size: 10px; 
  overflow-y: auto;
  font-family: 'Courier New', monospace; 
  direction: rtl;
  padding-top: 35px;
}
#phoneScreen::-webkit-scrollbar { width: 3px; }
#phoneScreen::-webkit-scrollbar-thumb { 
  background: #0f0; 
  border-radius: 3px; 
}
.phone-header {
  text-align: center; 
  padding: 8px; 
  border-bottom: 2px solid #0f03;
  margin-bottom: 10px; 
  font-size: 11px; 
  color: #0f0;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(0,255,0,0.5);
}
.phone-msg {
  background: rgba(0,255,0,0.08); 
  border: 1px solid #0f03;
  border-radius: 8px; 
  padding: 8px; 
  margin: 6px 0;
  animation: msgAppear 0.5s ease-out;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
@keyframes msgAppear { 
  from { opacity: 0; transform: translateY(10px); } 
  to { opacity: 1; transform: translateY(0); } 
}
.phone-msg .sender { 
  color: #f80; 
  font-size: 9px; 
  margin-bottom: 3px;
  font-weight: bold;
}
.phone-msg .text { 
  color: #0f0; 
  line-height: 1.5; 
  text-shadow: 0 0 5px rgba(0,255,0,0.3);
}
.phone-time { 
  color: #0a0; 
  font-size: 9px; 
  text-align: center; 
  margin-top: 10px;
  border-top: 1px solid #0f03;
  padding-top: 8px;
}

/* ===== HUD ===== */
#hud {
  position: fixed; 
  bottom: 20px; 
  left: 20px; 
  z-index: 150;
  pointer-events: none;
}
.hud-bar {
  width: 140px; 
  height: 6px; 
  background: rgba(255,255,255,0.1);
  border-radius: 3px; 
  margin: 3px 0; 
  overflow: hidden;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}
.hud-bar-fill {
  height: 100%; 
  border-radius: 3px; 
  transition: width 0.3s;
  box-shadow: 0 0 10px currentColor;
}
#healthBar .hud-bar-fill { 
  background: linear-gradient(90deg, #f00, #f44); 
  width: 100%; 
  color: #f44;
}
#staminaBar .hud-bar-fill { 
  background: linear-gradient(90deg, #0af, #4cf); 
  width: 100%; 
  color: #4cf;
}
.hud-label { 
  color: rgba(255,255,255,0.6); 
  font-size: 10px; 
  margin-bottom: 2px;
  text-shadow: 0 2px 5px rgba(0,0,0,0.8);
}

#floorInfo {
  position: fixed; 
  top: 20px; 
  left: 50%; 
  transform: translateX(-50%);
  color: rgba(255,255,255,0.8); 
  font-size: 15px; 
  z-index: 150;
  text-shadow: 0 2px 15px rgba(0,0,0,0.9); 
  pointer-events: none;
  letter-spacing: 2px; 
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  background: rgba(0,0,0,0.5);
  padding: 8px 20px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

#startMenu {
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%;
  background: linear-gradient(135deg, #0a0a0a, #1a0a0a);
  z-index: 1000; 
  display: flex; 
  flex-direction: column;
  align-items: center; 
  justify-content: center;
}
#startMenu h1 {
  font-size: 56px; 
  color: #fff; 
  text-shadow: 0 0 40px rgba(255,50,50,0.6);
  margin-bottom: 10px; 
  letter-spacing: 6px;
  animation: titlePulse 3s ease-in-out infinite;
}
@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 40px rgba(255,50,50,0.6); }
  50% { text-shadow: 0 0 60px rgba(255,50,50,0.9); }
}
#startMenu .subtitle {
  color: rgba(255,255,255,0.5); 
  font-size: 14px; 
  margin-bottom: 40px;
  letter-spacing: 4px;
}
#startBtn, #continueBtn {
  padding: 14px 50px; 
  font-size: 16px; 
  background: transparent;
  border: 2px solid rgba(255,255,255,0.3); 
  color: #fff;
  cursor: pointer; 
  letter-spacing: 3px; 
  transition: all 0.3s;
  border-radius: 6px; 
  font-family: inherit; 
  margin: 8px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#startBtn:hover, #continueBtn:hover {
  background: rgba(255,50,50,0.2); 
  border-color: #f33;
  box-shadow: 0 0 30px rgba(255,50,50,0.4);
  transform: scale(1.05);
}
#continueBtn { 
  display: none; 
  border-color: rgba(0,255,0,0.3); 
  color: rgba(0,255,0,0.8); 
}
#continueBtn:hover {
  background: rgba(0,255,0,0.1);
  border-color: #0f0;
  box-shadow: 0 0 30px rgba(0,255,0,0.4);
}

#loadingScreen {
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%;
  background: #000; 
  z-index: 2000; 
  display: none;
  flex-direction: column; 
  align-items: center; 
  justify-content: center;
}
#loadingBar {
  width: 250px; 
  height: 4px; 
  background: rgba(255,255,255,0.1);
  border-radius: 3px; 
  overflow: hidden; 
  margin-top: 20px;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}
#loadingBarFill {
  width: 0%; 
  height: 100%; 
  background: linear-gradient(90deg, #f33, #f66);
  transition: width 0.3s; 
  border-radius: 3px;
  box-shadow: 0 0 15px #f33;
}
#loadingText { 
  color: rgba(255,255,255,0.6); 
  font-size: 13px; 
  letter-spacing: 3px;
  text-shadow: 0 0 10px rgba(255,255,255,0.3);
}

#damageOverlay {
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%;
  pointer-events: none; 
  z-index: 90; 
  opacity: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.5) 100%);
  transition: opacity 0.3s;
}

#gameClock {
  position: fixed; 
  top: 20px; 
  right: 20px; 
  z-index: 150;
  color: rgba(255,255,255,0.6); 
  font-size: 13px; 
  pointer-events: none;
  font-family: 'Courier New', monospace;
  background: rgba(0,0,0,0.5);
  padding: 8px 15px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.1);
}

#interactionPrompt {
  position: fixed; 
  top: 55%; 
  left: 50%; 
  transform: translateX(-50%);
  color: rgba(255,255,255,0.9); 
  font-size: 14px; 
  z-index: 150;
  pointer-events: none; 
  opacity: 0; 
  transition: opacity 0.3s;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  background: rgba(0,0,0,0.7); 
  padding: 10px 20px; 
  border-radius: 8px;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

#mobileHint {
  position: fixed; 
  bottom: 90px; 
  left: 50%; 
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5); 
  font-size: 11px; 
  z-index: 150;
  pointer-events: none; 
  text-align: center;
  animation: fadeHint 4s ease-in-out infinite;
  background: rgba(0,0,0,0.5);
  padding: 8px 15px;
  border-radius: 15px;
}
@keyframes fadeHint { 
  0%,100% { opacity: 0.3; } 
  50% { opacity: 0.8; } 
}

#newMsgNotif {
  position: fixed; 
  top: 60px; 
  right: 20px;
  background: rgba(0,255,0,0.2);
  border: 2px solid rgba(0,255,0,0.5);
  border-radius: 10px;
  padding: 10px 15px;
  color: #0f0;
  font-size: 12px;
  z-index: 180;
  pointer-events: none;
  opacity: 0;
  transform: translateX(30px);
  transition: all 0.4s;
  box-shadow: 0 0 20px rgba(0,255,0,0.3);
  font-weight: bold;
}
#newMsgNotif.show {
  opacity: 1;
  transform: translateX(0);
}

/* ===== افکت‌های ویژه ===== */
@keyframes scanline {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}
#scanline {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 5px;
  background: rgba(0,255,0,0.1);
  z-index: 95;
  pointer-events: none;
  animation: scanline 8s linear infinite;
}
</style>
</head>

<!-- Three.js و افزونه‌ها -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== متغیرهای سراسری بازی =====
let scene, camera, renderer, composer;
let clock = new THREE.Clock();
let playerState = {
  health: 100,
  stamina: 100,
  floor: 30,
  isRunning: false,
  isCrouching: false,
  flashlightOn: true,
  gameStarted: false,
  gameTime: 0,
  inCasualClothes: true,
  rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
  velocity: new THREE.Vector3(),
  position: new THREE.Vector3(0, 1.7, 2)
};

// سیستم نورپردازی
let flashlight, flashlightTarget;
let ambientLights = [];
let dynamicLights = [];

// سیستم ذرات
let particles = [];
let dustParticles = [];
let fogParticles = [];

// سیستم تعامل
let interactables = [];
let currentInteractable = null;
let interactionDistance = 3;

// کنترل‌های لمسی
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
let joystickVector = { x: 0, y: 0 };
let lookTouchId = null;
let lookLastPos = { x: 0, y: 0 };
let runPressed = false;
let crouchPressed = false;

// وضعیت گوشی
let phoneOpen = false;
let phoneMessages = [];

// سیستم صدا
let audioContext = null;
let soundEnabled = true;

// ===== شیدر سفارشی برای افکت‌های سینمایی =====
const CustomShader = {
  uniforms: {
    tDiffuse: { value: null },
    time: { value: 0 },
    intensity: { value: 1.0 },
    damage: { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float intensity;
    uniform float damage;
    varying vec2 vUv;
    
    float random(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
    }
    
    void main() {
      vec2 uv = vUv;
      
      // انحراف رنگی (Chromatic Aberration)
      float dist = distance(uv, vec2(0.5));
      float aberration = dist * 0.003 * intensity;
      vec4 cr = texture2D(tDiffuse, uv + vec2(aberration, 0.0));
      vec4 cg = texture2D(tDiffuse, uv);
      vec4 cb = texture2D(tDiffuse, uv - vec2(aberration, 0.0));
      vec4 color = vec4(cr.r, cg.g, cb.b, 1.0);
      
      // نویز فیلم (Film Grain)
      float grain = random(uv * time) * 0.04 - 0.02;
      color.rgb += grain;
      
      // وینیت (Vignette)
      float vignette = 1.0 - dist * 0.7;
      color.rgb *= vignette;
      
      // افکت آسیب
      if (damage > 0.0) {
        float damageEffect = damage * 0.5;
        color.rgb = mix(color.rgb, vec3(1.0, 0.0, 0.0), damageEffect * (1.0 - vignette));
      }
      
      // کاهش اشباع برای حس سینمایی
      float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
      color.rgb = mix(vec3(lum), color.rgb, 0.85);
      
      gl_FragColor = color;
    }
  `
};

// ===== راه‌اندازی موتور گرافیکی =====
function initEngine() {
  console.log('Initializing game engine...');
  
  const canvas = document.getElementById('gameCanvas');
  
  // رندرر WebGL2 با تنظیمات پیشرفته
  renderer = new THREE.WebGLRenderer({ 
    canvas, 
    antialias: false, 
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.physicallyCorrectLights = true;

  // صحنه با مه حجمی
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a15, 0.006);
  scene.background = new THREE.Color(0x080812);

  // دوربین با FOV سینمایی
  camera
