<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧟 Zombie Survival</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(255, 50, 50, 0.3);
      border: 3px solid #333;
      border-radius: 8px;
    }
    canvas {
      display: block;
      background: #1a1a1a;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 18px;
      text-shadow: 0 0 6px #000;
    }
    #health-bar {
      width: 200px;
      height: 18px;
      background: #333;
      border: 2px solid #555;
      border-radius: 4px;
      overflow: hidden;
    }
    #health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e74c3c, #c0392b);
      transition: width 0.2s;
    }
    #score, #wave {
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 4px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
    }
    #overlay h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #e74c3c;
      text-shadow: 0 0 20px #e74c3c;
    }
    #overlay p {
      font-size: 18px;
      margin: 8px 0;
      max-width: 400px;
      line-height: 1.5;
    }
    #overlay button {
      margin-top: 20px;
      padding: 12px 32px;
      font-size: 20px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    #overlay button:hover {
      background: #c0392b;
      transform: scale(1.05);
    }
    #controls {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.7;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="ui">
      <div>
        <div id="health-bar"><div id="health-fill"></div></div>
      </div>
      <div id="wave">Wave: 1</div>
      <div id="score">Score: 0</div>
    </div>
    <div id="overlay">
      <h1>🧟 Zombie Survival</h1>
      <p>زامبی‌ها دارن میآن! زنده بمون و تا جایی که می‌تونی مقاومت کن.</p>
      <p id="final-score" class="hidden"></p>
      <button id="start-btn">شروع بازی 🔥</button>
      <div id="controls">
        حرکت: WASD یا فلش‌ها<br>
        شلیک: کلیک ماوس یا Space<br>
        هدف‌گیری: ماوس
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const healthFill = document.getElementById('health-fill');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const finalScoreEl = document.getElementById('final-score');

    // Game state
    let running = false;
    let score = 0;
    let wave = 1;
    let keys = {};
    let mouse = { x: 0, y: 0, down: false };
    let lastShot = 0;
    let particles = [];
    let blood = [];

    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 16,
      speed: 3.2,
      health: 100,
      maxHealth: 100,
      angle: 0,
      shootCooldown: 180
    };

    // Arrays
    let zombies = [];
    let bullets = [];

    // Colors
    const colors = {
      player: '#3498db',
      zombie: '#27ae60',
      zombieDark: '#1e8449',
      bullet: '#f1c40f',
      blood: '#c0392b'
    };

    // Init
    function resetGame() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.health = 100;
      player.angle = 0;
      score = 0;
      wave = 1;
      zombies = [];
      bullets = [];
      particles = [];
      blood = [];
      lastShot = 0;
      spawnWave();
      updateUI();
    }

    function spawnWave() {
      const count = 4 + wave * 2;
      for (let i = 0; i < count; i++) {
        spawnZombie();
      }
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -30; }
      else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
      else { x = -30; y = Math.random() * canvas.height; }

      const speed = 0.7 + Math.random() * 0.6 + wave * 0.08;
      const health = 30 + wave * 8;

      zombies.push({
        x, y,
        radius: 14 + Math.random() * 4,
        speed,
        health,
        maxHealth: health,
        angle: 0,
        hitFlash: 0
      });
    }

    // Input
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => mouse.down = true);
    canvas.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('mouseleave', () => mouse.down = false);

    // Helpers
    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function angleTo(from, to) {
      return Math.atan2(to.y - from.y, to.x - from.x);
    }

    function createParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 30 + Math.random() * 20,
          maxLife: 50,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function createBlood(x, y) {
      for (let i = 0; i < 5; i++) {
        blood.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          size: 3 + Math.random() * 5,
          life: 120 + Math.random() * 80
        });
      }
    }

    // Update
    function update() {
      if (!running) return;

      // Player movement
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
      }

      // Bounds
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Aim
      player.angle = angleTo(player, mouse);

      // Shooting
      const now = Date.now();
      if ((mouse.down || keys['Space']) && now - lastShot > player.shootCooldown) {
        lastShot = now;
        const speed = 9;
        bullets.push({
          x: player.x + Math.cos(player.angle) * (player.radius + 4),
          y: player.y + Math.sin(player.angle) * (player.radius + 4),
          vx: Math.cos(player.angle) * speed,
          vy: Math.sin(player.angle) * speed,
          life: 60
        });
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
          continue;
        }

        // Hit zombies
        for (let j = zombies.length - 1; j >= 0; j--) {
          const z = zombies[j];
          if (dist(b, z) < z.radius + 4) {
            z.health -= 25;
            z.hitFlash = 8;
            createParticles(b.x, b.y, '#f1c40f', 4);
            bullets.splice(i, 1);

            if (z.health <= 0) {
              score += 10 + wave * 2;
              createParticles(z.x, z.y, colors.zombie, 12);
              createBlood(z.x, z.y);
              zombies.splice(j, 1);
            }
            break;
          }
        }
      }

      // Update zombies
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.angle = angleTo(z, player);
        z.x += Math.cos(z.angle) * z.speed;
        z.y += Math.sin(z.angle) * z.speed;
        if (z.hitFlash > 0) z.hitFlash--;

        // Hit player
        if (dist(z, player) < z.radius + player.radius - 4) {
          player.health -= 0.4;
          if (Math.random() < 0.1) createBlood(player.x, player.y);
        }
      }

      // Wave complete?
      if (zombies.length === 0) {
        wave++;
        spawnWave();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Blood fade
      for (let i = blood.length - 1; i >= 0; i--) {
        blood[i].life--;
        if (blood[i].life <= 0) blood.splice(i, 1);
      }

      // Death
      if (player.health <= 0) {
        player.health = 0;
        running = false;
        finalScoreEl.textContent = `امتیاز نهایی: ${score} | موج: ${wave}`;
        finalScoreEl.classList.remove('hidden');
        overlay.querySelector('h1').textContent = '💀 مردی!';
        startBtn.textContent = 'دوباره بازی کن 🔄';
        overlay.classList.remove('hidden');
      }

      updateUI();
    }

    function updateUI() {
      healthFill.style.width = Math.max(0, player.health) + '%';
      scoreEl.textContent = `Score: ${score}`;
      waveEl.textContent = `Wave: ${wave}`;
    }

    // Draw
    function draw() {
      // Background
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Blood stains
      blood.forEach(b => {
        ctx.globalAlpha = Math.min(1, b.life / 60);
        ctx.fillStyle = colors.blood;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Bullets
      bullets.forEach(b => {
        ctx.fillStyle = colors.bullet;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Zombies
      zombies.forEach(z => {
        ctx.save();
        ctx.translate(z.x, z.y);
        ctx.rotate(z.angle);

        // Body
        ctx.fillStyle = z.hitFlash > 0 ? '#fff' : colors.zombie;
        ctx.beginPath();
        ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(6, -5, 3, 0, Math.PI * 2);
        ctx.arc(6, 5, 3, 0, Math.PI * 2);
        ctx.fill();

        // Health bar
        if (z.health < z.maxHealth) {
          ctx.rotate(-z.angle);
          ctx.fillStyle = '#333';
          ctx.fillRect(-z.radius, -z.radius - 10, z.radius * 2, 4);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(-z.radius, -z.radius - 10, z.radius * 2 * (z.health / z.maxHealth), 4);
        }

        ctx.restore();
      });

      // Player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      // Body
      ctx.fillStyle = colors.player;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Gun
      ctx.fillStyle = '#555';
      ctx.fillRect(8, -3, 18, 6);

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(5, -6, 4, 0, Math.PI * 2);
      ctx.arc(5, 6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(6, -6, 2, 0, Math.PI * 2);
      ctx.arc(6, 6, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Start
    startBtn.addEventListener('click', () => {
      resetGame();
      running = true;
      overlay.classList.add('hidden');
      finalScoreEl.classList.add('hidden');
    });

    // First draw
    draw();
    loop();
  </script>
</body>
</html>
