<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🤖 AI Code Generator</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1e2e, #2d2d44);
    color: #fff;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: auto; }
  h1 { text-align: center; color: #4CAF50; }
  .card {
    background: #282c34;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  textarea, input, select {
    width: 100%;
    padding: 12px;
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 15px;
    font-family: Tahoma, sans-serif;
  }
  textarea { height: 120px; resize: vertical; }
  button {
    padding: 12px 24px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin: 5px;
    transition: 0.2s;
  }
  button:hover { background: #45a049; transform: translateY(-2px); }
  .btn-danger { background: #f44336; }
  .btn-danger:hover { background: #d32f2f; }
  #output {
    background: #282c34;
    padding: 20px;
    border-radius: 8px;
    margin-top: 15px;
    overflow-x: auto;
    min-height: 100px;
  }
  pre { background: #1e1e1e !important; padding: 15px; border-radius: 8px; position: relative; }
  pre code { font-size: 14px; font-family: Consolas, monospace; }
  .copy-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #555;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 5px;
  }
  .loading { text-align: center; color: #4CAF50; }
  .loading::after {
    content: '...';
    animation: dots 1.5s infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🤖 تولیدکننده کد با هوش مصنوعی</h1>

  <div class="card">
    <label>🔑 کلید API (از openai.com یا هر سرویس سازگار بگیر):</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <br><br>
    <label>🧠 مدل:</label>
    <select id="model">
      <option value="gpt-4o-mini">GPT-4o Mini (سریع و ارزان)</option>
      <option value="gpt-4o">GPT-4o (قدرتمند)</option>
      <option value="gpt-4-turbo">GPT-4 Turbo</option>
    </select>
  </div>

  <div class="card">
    <label>💬 دقیقاً چه سایت یا کدی می‌خواهی؟</label>
    <textarea id="prompt" placeholder="مثال: یک سایت فروشگاهی با HTML، CSS و JavaScript بساز که سبد خرید داشته باشد"></textarea>
    <br>
    <button onclick="generate()">✨ تولید کد</button>
    <button class="btn-danger" onclick="clearAll()">🗑️ پاک کردن</button>
  </div>

  <div class="card">
    <label>📤 خروجی:</label>
    <div id="output">هنوز چیزی تولید نشده...</div>
  </div>
</div>

<script>
async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const model = document.getElementById('model').value;
  const output = document.getElementById('output');

  if (!apiKey) { alert('⚠️ لطفاً API Key را وارد کن'); return; }
  if (!prompt) { alert('⚠️ لطفاً درخواستت را بنویس'); return; }

  output.innerHTML = '<p class="loading">در حال تولید کد، لطفاً صبر کنید</p>';

  try {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        messages: [
          {
            role: 'system',
            content: 'تو یک برنامه‌نویس ارشد و حرفه‌ای هستی. هر درخواست کاربر را دقیقاً و کامل اجرا کن. کدها باید کامل، قابل اجرا، بدون خطا و با کامنت‌های فارسی باشند. همیشه از markdown code blocks با مشخص کردن زبان استفاده کن (مثل ```html، ```python و...).'
          },
          { role: 'user', content: prompt }
        ],
        temperature: 0.3
      })
    });

    const data = await response.json();
    if (data.error) {
      output.innerHTML = '<p style="color:#f44336">❌ خطا: ' + data.error.message + '</p>';
      return;
    }

    const content = data.choices[0].message.content;
    output.innerHTML = marked.parse(content);

    // اضافه کردن syntax highlighting و دکمه کپی
    document.querySelectorAll('pre code').forEach(block => {
      hljs.highlightElement(block);
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = '📋 کپی';
      btn.onclick = () => {
        navigator.clipboard.writeText(block.textContent);
        btn.textContent = '✓ کپی شد';
        setTimeout(() => btn.textContent = '📋 کپی', 1500);
      };
      block.parentElement.style.position = 'relative';
      block.parentElement.appendChild(btn);
    });
  } catch (e) {
    output.innerHTML = '<p style="color:#f44336">❌ خطا: ' + e.message + '</p>';
  }
}

function clearAll() {
  document.getElementById('prompt').value = '';
  document.getElementById('output').innerHTML = 'هنوز چیزی تولید نشده...';
}
</script>
</body>
</html>
