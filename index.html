<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برج ۳۰ - Survival Horror</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; cursor: none; user-select: none; }
#gameCanvas { width: 100vw; height: 100vh; display: block; }

#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 20px; height: 20px; pointer-events: none; z-index: 100;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.6);
}
#crosshair::before { width: 1px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { height: 1px; width: 100%; top: 50%; transform: translateY(-50%); }

#smartphone {
  position: fixed; bottom: -320px; right: 20px; width: 180px; height: 320px;
  background: #111; border-radius: 18px; border: 2px solid #444;
  z-index: 200; transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
}
#smartphone.active { bottom: 15px; }
#phoneScreen {
  width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
  padding: 12px; color: #0f0; font-size: 10px; overflow-y: auto;
  font-family: 'Courier New', monospace; direction: rtl;
}
#phoneScreen::-webkit-scrollbar { width: 2px; }
#phoneScreen::-webkit-scrollbar-thumb { background: #0f0; }
.phone-header {
  text-align: center; padding: 6px; border-bottom: 1px solid #0f03;
  margin-bottom: 8px; font-size: 9px; color: #0a0;
}
.phone-msg {
  background: rgba(0,255,0,0.05); border: 1px solid #0f03;
  border-radius: 6px; padding: 6px; margin: 5px 0;
  animation: msgAppear 0.4s ease-out;
}
@keyframes msgAppear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.phone-msg .sender { color: #f80; font-size: 8px; margin-bottom: 2px; }
.phone-msg .text { color: #0f0; line-height: 1.4; }
.phone-time { color: #0a0; font-size: 8px; text-align: center; margin-top: 8px; }

#hud {
  position: fixed; bottom: 25px; left: 25px; z-index: 150;
  pointer-events: none;
}
.hud-bar {
  width: 180px; height: 5px; background: rgba(255,255,255,0.1);
  border-radius: 3px; margin: 3px 0; overflow: hidden;
}
.hud-bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.3s;
}
#healthBar .hud-bar-fill { background: linear-gradient(90deg, #f00, #f44); width: 100%; }
#staminaBar .hud-bar-fill { background: linear-gradient(90deg, #0af, #4cf); width: 100%; }
.hud-label { color: rgba(255,255,255,0.5); font-size: 9px; margin-bottom: 1px; }

#floorInfo {
  position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7); font-size: 16px; z-index: 150;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9); pointer-events: none;
  letter-spacing: 2px; font-family: 'Courier New', monospace;
}

#startMenu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #0a0a0a, #1a0a0a);
  z-index: 1000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
#startMenu h1 {
  font-size: 64px; color: #fff; text-shadow: 0 0 30px rgba(255,50,50,0.5);
  margin-bottom: 8px; letter-spacing: 6px;
}
#startMenu .subtitle {
  color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 40px;
  letter-spacing: 4px;
}
#startBtn {
  padding: 14px 50px; font-size: 16px; background: transparent;
  border: 2px solid rgba(255,255,255,0.3); color: #fff;
  cursor: pointer; letter-spacing: 2px; transition: all 0.3s;
  border-radius: 4px; font-family: inherit;
}
#startBtn:hover {
  background: rgba(255,50,50,0.2); border-color: #f33;
  box-shadow: 0 0 30px rgba(255,50,50,0.3);
}
#continueBtn {
  padding: 10px 35px; font-size: 13px; background: transparent;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
  cursor: pointer; margin-top: 12px; letter-spacing: 2px;
  border-radius: 4px; transition: all 0.3s; font-family: inherit;
}
#continueBtn:hover { border-color: #0f0; color: #0f0; }

#loadingScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 2000; display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
#loadingBar {
  width: 280px; height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; overflow: hidden; margin-top: 15px;
}
#loadingBarFill {
  width: 0%; height: 100%; background: #f33;
  transition: width 0.3s; border-radius: 2px;
}
#loadingText { color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 3px; }

#controls {
  position: fixed; bottom: 25px; right: 25px; z-index: 150;
  color: rgba(255,255,255,0.35); font-size: 10px; pointer-events: none;
  text-align: right; line-height: 1.7;
}

#damageOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 90; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.4) 100%);
  transition: opacity 0.3s;
}

#gameClock {
  position: fixed; top: 25px; right: 25px; z-index: 150;
  color: rgba(255,255,255,0.5); font-size: 13px; pointer-events: none;
  font-family: 'Courier New', monospace;
}

#interactionPrompt {
  position: fixed; top: 55%; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7); font-size: 13px; z-index: 150;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
  text-shadow: 0 1px 5px rgba(0,0,0,0.8);
  background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 4px;
}
</style>
</head>
<body>

<div id="startMenu">
  <h1>TOWER 30</h1>
  <div class="subtitle">بقا در برج سی طبقه</div>
  <button id="startBtn" onclick="startNewGame()">شروع بازی جدید</button>
  <button id="continueBtn" onclick="continueGame()" style="display:none;">ادامه بازی</button>
</div>

<div id="loadingScreen">
  <div id="loadingText">در حال بارگذاری...</div>
  <div id="loadingBar"><div id="loadingBarFill"></div></div>
</div>

<canvas id="gameCanvas"></canvas>
<div id="crosshair"></div>
<div id="damageOverlay"></div>
<div id="floorInfo">طبقه ۳۰ — آپارتمان شما</div>
<div id="gameClock">00:00</div>

<div id="smartphone">
  <div id="phoneScreen">
    <div class="phone-header">📱 پیام‌ها — ناشناس</div>
    <div id="phoneMessages"></div>
    <div class="phone-time" id="phoneTime"></div>
  </div>
</div>

<div id="hud">
  <div class="hud-label">سلامت</div>
  <div class="hud-bar" id="healthBar"><div class="hud-bar-fill"></div></div>
  <div class="hud-label">استامینا</div>
  <div class="hud-bar" id="staminaBar"><div class="hud-bar-fill"></div></div>
</div>

<div id="controls">
  WASD — حرکت | Shift — دویدن<br>
  Mouse — نگاه | F — چراغ‌قوه<br>
  E — تعامل | H — گوشی<br>
  ESC — منو
</div>

<div id="interactionPrompt"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== متغیرهای سراسری =====
let scene, camera, renderer, composer;
let clock = new THREE.Clock();
let playerState = {
  health: 100, stamina: 100, floor: 30,
  isRunning: false, flashlightOn: true,
  gameStarted: false, gameTime: 0,
  inCasualClothes: true
};
let keys = {};
let mouseMovement = { x: 0, y: 0 };
let isPointerLocked = false;
let flashlight, flashlightTarget;
let particles = [];
let phoneMessages = [];
let interactables = [];
let currentInteractable = null;

// ===== شیدر سفارشی =====
const CustomShader = {
  uniforms: {
    tDiffuse: { value: null },
    time: { value: 0 },
    intensity: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float intensity;
    varying vec2 vUv;
    
    float random(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
    }
    
    void main() {
      vec2 uv = vUv;
      float dist = distance(uv, vec2(0.5));
      float aberration = dist * 0.002 * intensity;
      vec4 cr = texture2D(tDiffuse, uv + vec2(aberration, 0.0));
      vec4 cg = texture2D(tDiffuse, uv);
      vec4 cb = texture2D(tDiffuse, uv - vec2(aberration, 0.0));
      vec4 color = vec4(cr.r, cg.g, cb.b, 1.0);
      
      float grain = random(uv * time) * 0.03 - 0.015;
      color.rgb += grain;
      
      float vignette = 1.0 - dist * 0.6;
      color.rgb *= vignette;
      
      float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
      color.rgb = mix(vec3(lum), color.rgb, 0.88);
      
      gl_FragColor = color;
    }
  `
};

// ===== راه‌اندازی موتور =====
function initEngine() {
  const canvas = document.getElementById('gameCanvas');
  
  renderer = new THREE.WebGLRenderer({ 
    canvas, antialias: false, powerPreference: 'high-performance' 
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a15, 0.008);
  scene.background = new THREE.Color(0x080812);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 2);

  // ===== نورپردازی =====
  const hemiLight = new THREE.HemisphereLight(0x2a2a4e, 0x1a1a1a, 0.6);
  scene.add(hemiLight);

  const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.4);
  scene.add(ambientLight);

  // نور اصلی سقف آپارتمان
  const ceilingLight = new THREE.PointLight(0xffeedd, 15, 12);
  ceilingLight.position.set(0, 2.8, 0);
  ceilingLight.castShadow = true;
  ceilingLight.shadow.mapSize.set(2048, 2048);
  ceilingLight.shadow.bias = -0.001;
  scene.add(ceilingLight);

  // نور پنجره (نور شهر)
  const windowLight = new THREE.DirectionalLight(0x4466aa, 1.5);
  windowLight.position.set(0, 5, -10);
  windowLight.target.position.set(0, 0, 0);
  windowLight.castShadow = true;
  windowLight.shadow.mapSize.set(2048, 2048);
  windowLight.shadow.camera.near = 0.1;
  windowLight.shadow.camera.far = 30;
  windowLight.shadow.camera.left = -10;
  windowLight.shadow.camera.right = 10;
  windowLight.shadow.camera.top = 10;
  windowLight.shadow.camera.bottom = -10;
  scene.add(windowLight);
  scene.add(windowLight.target);

  // چراغ‌قوه
  flashlight = new THREE.SpotLight(0xffeedd, 8, 15, Math.PI / 5, 0.6, 1.5);
  flashlight.castShadow = true;
  flashlight.shadow.mapSize.set(1024, 1024);
  flashlight.shadow.bias = -0.001;
  scene.add(flashlight);
  
  flashlightTarget = new THREE.Object3D();
  scene.add(flashlightTarget);
  flashlight.target = flashlightTarget;

  // ===== پس‌پردازش =====
  composer = new EffectComposer(renderer);
  
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.3, 0.5, 0.9
  );
  composer.addPass(bloomPass);

  const smaaPass = new SMAAPass(window.innerWidth, window.innerHeight);
  composer.addPass(smaaPass);

  const customPass = new ShaderPass(CustomShader);
  composer.addPass(customPass);

  const outputPass = new OutputPass();
  composer.addPass(outputPass);

  // ===== ساخت محیط =====
  buildFloor30();
  createDustParticles();
  setupEvents();
  checkSaveData();
}

// ===== ساخت طبقه ۳۰ =====
function buildFloor30() {
  const floorGroup = new THREE.Group();

  // متریال‌ها
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x9a9a8a, roughness: 0.85, metalness: 0.0
  });
  
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x5a4a3a, roughness: 0.7, metalness: 0.0
  });

  const ceilingMat = new THREE.MeshStandardMaterial({
    color: 0xaaaaaa, roughness: 0.9, metalness: 0.0
  });

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x88aacc, roughness: 0.0, metalness: 0.0,
    transmission: 0.8, thickness: 0.05, ior: 1.5,
    transparent: true, opacity: 0.2, side: THREE.DoubleSide
  });

  const furnitureMat = new THREE.MeshStandardMaterial({
    color: 0x3a2a1a, roughness: 0.75, metalness: 0.0
  });

  const metalMat = new THREE.MeshStandardMaterial({
    color: 0x888888, roughness: 0.3, metalness: 0.8
  });

  const doorMat = new THREE.MeshStandardMaterial({
    color: 0x5a4a3a, roughness: 0.6, metalness: 0.1
  });

  const rugMat = new THREE.MeshStandardMaterial({
    color: 0x8a2a2a, roughness: 0.95
  });

  const tvMat = new THREE.MeshStandardMaterial({
    color: 0x111111, roughness: 0.1, metalness: 0.5
  });

  const tvScreenMat = new THREE.MeshBasicMaterial({ color: 0x1a2a4a });

  const plantMat = new THREE.MeshStandardMaterial({
    color: 0x2a6a1a, roughness: 0.8
  });

  const potMat = new THREE.MeshStandardMaterial({
    color: 0x8a5a3a, roughness: 0.8
  });

  const fridgeMat = new THREE.MeshStandardMaterial({
    color: 0xcccccc, roughness: 0.2, metalness: 0.7
  });

  // کف
  const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.15, 10), floorMat);
  floor.position.set(0, 0, 0);
  floor.receiveShadow = true;
  floorGroup.add(floor);

  // سقف
  const ceiling = new THREE.Mesh(new THREE.BoxGeometry(12, 0.15, 10), ceilingMat);
  ceiling.position.set(0, 3, 0);
  ceiling.receiveShadow = true;
  floorGroup.add(ceiling);

  // دیوار پشت (با پنجره)
  // بخش چپ پنجره
  const wallBackLeft = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3, 0.2), wallMat);
  wallBackLeft.position.set(-4.25, 1.5, -5);
  wallBackLeft.castShadow = true; wallBackLeft.receiveShadow = true;
  floorGroup.add(wallBackLeft);

  // بخش راست پنجره
  const wallBackRight = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3, 0.2), wallMat);
  wallBackRight.position.set(4.25, 1.5, -5);
  wallBackRight.castShadow = true; wallBackRight.receiveShadow = true;
  floorGroup.add(wallBackRight);

  // بالای پنجره
  const wallBackTop = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 0.2), wallMat);
  wallBackTop.position.set(0, 2.75, -5);
  floorGroup.add(wallBackTop);

  // زیر پنجره
  const wallBackBottom = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 0.2), wallMat);
  wallBackBottom.position.set(0, 0.25, -5);
  floorGroup.add(wallBackBottom);

  // شیشه پنجره
  const windowGlass = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2, 0.05), glassMat);
  windowGlass.position.set(0, 1.5, -5);
  floorGroup.add(windowGlass);

  // قاب پنجره
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 });
  const frameH = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.08, 0.25), frameMat);
  frameH.position.set(0, 2.5, -5);
  floorGroup.add(frameH);
  const frameH2 = frameH.clone();
  frameH2.position.y = 0.5;
  floorGroup.add(frameH2);
  const frameV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.1, 0.25), frameMat);
  frameV.position.set(0, 1.5, -5);
  floorGroup.add(frameV);

  // دیوار جلو (با درب)
  const wallFrontLeft = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 0.2), wallMat);
  wallFrontLeft.position.set(-3.5, 1.5, 5);
  wallFrontLeft.castShadow = true; wallFrontLeft.receiveShadow = true;
  floorGroup.add(wallFrontLeft);

  const wallFrontRight = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 0.2), wallMat);
  wallFrontRight.position.set(3.5, 1.5, 5);
  wallFrontRight.castShadow = true; wallFrontRight.receiveShadow = true;
  floorGroup.add(wallFrontRight);

  const wallFrontTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 0.2), wallMat);
  wallFrontTop.position.set(0, 2.6, 5);
  floorGroup.add(wallFrontTop);

  // درب
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), doorMat);
  door.position.set(0, 1.1, 5);
  door.castShadow = true;
  floorGroup.add(door);

  const doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), metalMat);
  doorHandle.position.set(0.4, 1.1, 5.08);
  floorGroup.add(doorHandle);

  // دیوار چپ
  const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 10), wallMat);
  wallLeft.position.set(-6, 1.5, 0);
  wallLeft.castShadow = true; wallLeft.receiveShadow = true;
  floorGroup.add(wallLeft);

  // دیوار راست
  const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 10), wallMat);
  wallRight.position.set(6, 1.5, 0);
  wallRight.castShadow = true; wallRight.receiveShadow = true;
  floorGroup.add(wallRight);

  // ===== مبلمان =====
  
  // مبل
  const sofaSeat = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.9), furnitureMat);
  sofaSeat.position.set(-3.5, 0.3, 2.5);
  sofaSeat.castShadow = true; sofaSeat.receiveShadow = true;
  floorGroup.add(sofaSeat);

  const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.15), furnitureMat);
  sofaBack.position.set(-3.5, 0.65, 2.95);
  sofaBack.castShadow = true;
  floorGroup.add(sofaBack);

  const sofaArmL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.9), furnitureMat);
  sofaArmL.position.set(-4.55, 0.5, 2.5);
  sofaArmL.castShadow = true;
  floorGroup.add(sofaArmL);

  const sofaArmR = sofaArmL.clone();
  sofaArmR.position.x = -2.45;
  floorGroup.add(sofaArmR);

  // کوسن‌ها
  const cushionMat = new THREE.MeshStandardMaterial({ color: 0x6a3a2a, roughness: 0.9 });
  const cushion1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.1), cushionMat);
  cushion1.position.set(-4.0, 0.7, 2.5);
  cushion1.rotation.z = 0.15;
  floorGroup.add(cushion1);
  const cushion2 = cushion1.clone();
  cushion2.position.x = -3.0;
  cushion2.rotation.z = -0.1;
  floorGroup.add(cushion2);

  // میز جلو مبل
  const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.7), furnitureMat);
  tableTop.position.set(-3.5, 0.55, 0.8);
  tableTop.castShadow = true; tableTop.receiveShadow = true;
  floorGroup.add(tableTop);

  const legGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.55, 8);
  [[-4.05, 0.275, 0.5], [-4.05, 0.275, 1.1], [-2.95, 0.275, 0.5], [-2.95, 0.275, 1.1]].forEach(pos => {
    const leg = new THREE.Mesh(legGeo, metalMat);
    leg.position.set(...pos);
    leg.castShadow = true;
    floorGroup.add(leg);
  });

  // ماگ روی میز
  const mugMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3 });
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.1, 8), mugMat);
  mug.position.set(-3.3, 0.63, 0.9);
  mug.castShadow = true;
  floorGroup.add(mug);

  // تلویزیون
  const tvStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.4), furnitureMat);
  tvStand.position.set(3.5, 0.25, -4.2);
  tvStand.castShadow = true; tvStand.receiveShadow = true;
  floorGroup.add(tvStand);

  const tv = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.06), tvMat);
  tv.position.set(3.5, 1.0, -4.3);
  tv.castShadow = true;
  floorGroup.add(tv);

  const tvScreen = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.02), tvScreenMat);
  tvScreen.position.set(3.5, 1.0, -4.26);
  floorGroup.add(tvScreen);

  const tvLight = new THREE.PointLight(0x2244aa, 2, 4);
  tvLight.position.set(3.5, 1.0, -3.8);
  floorGroup.add(tvLight);

  // کابینت آشپزخانه
  const cabinet = new THREE.Mesh(new THREE.BoxGeometry(2, 1.8, 0.5), furnitureMat);
  cabinet.position.set(4.5, 0.9, 3.5);
  cabinet.castShadow = true; cabinet.receiveShadow = true;
  floorGroup.add(cabinet);
  interactables.push({ mesh: cabinet, type: 'cabinet', label: 'جستجوی کابینت [E]' });

  // یخچال
  const fridge = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.8, 0.6), fridgeMat);
  fridge.position.set(5.5, 0.9, 3.5);
  fridge.castShadow = true; fridge.receiveShadow = true;
  floorGroup.add(fridge);
  interactables.push({ mesh: fridge, type: 'fridge', label: 'باز کردن یخچال [E]' });

  // چراغ سقفی
  const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), metalMat);
  lampBase.position.set(0, 2.96, 0);
  floorGroup.add(lampBase);

  const lampShade = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 0.2, 16),
    new THREE.MeshStandardMaterial({ color: 0xddddcc, roughness: 0.5, side: THREE.DoubleSide }));
  lampShade.position.set(0, 2.85, 0);
  floorGroup.add(lampShade);

  const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffeedd }));
  lampBulb.position.set(0, 2.78, 0);
  floorGroup.add(lampBulb);

  // فرش
  const rug = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.02, 1.8), rugMat);
  rug.position.set(-1, 0.08, 1);
  rug.receiveShadow = true;
  floorGroup.add(rug);

  // گلدان
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.25, 8), potMat);
  pot.position.set(2, 0.125, -3.5);
  pot.castShadow = true;
  floorGroup.add(pot);

  const plant = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), plantMat);
  plant.position.set(2, 0.38, -3.5);
  plant.castShadow = true;
  floorGroup.add(plant);

  // کتابخانه
  const bookshelf = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.3), furnitureMat);
  bookshelf.position.set(-5.7, 1, -2);
  bookshelf.castShadow = true; bookshelf.receiveShadow = true;
  floorGroup.add(bookshelf);

  // کتاب‌ها
  const bookColors = [0xaa2222, 0x2222aa, 0x22aa22, 0xaaaa22, 0x882288];
  for (let i = 0; i < 5; i++) {
    const book = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.25 + Math.random() * 0.1, 0.2),
      new THREE.MeshStandardMaterial({ color: bookColors[i], roughness: 0.8 })
    );
    book.position.set(-5.55 + i * 0.2, 1.5 + Math.random() * 0.3, -2);
    book.rotation.z = (Math.random() - 0.5) * 0.1;
    floorGroup.add(book);
  }

  // نمای شهر
  createCityView(floorGroup);

  scene.add(floorGroup);
}

// ===== نمای شهر =====
function createCityView(parent) {
  const buildingMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2a, roughness: 0.7, metalness: 0.3
  });

  for (let i = 0; i < 30; i++) {
    const h = 3 + Math.random() * 12;
    const w = 1 + Math.random() * 2;
    const d = 1 + Math.random() * 2;
    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    building.position.set(
      -20 + Math.random() * 40,
      -h/2 - 3,
      -25 - Math.random() * 40
    );
    building.castShadow = true;
    parent.add(building);

    if (Math.random() > 0.4) {
      const winLight = new THREE.PointLight(0xffaa44, 1, 4);
      winLight.position.set(
        building.position.x,
        building.position.y + h * 0.3,
        building.position.z + d/2 + 0.2
      );
      parent.add(winLight);
    }
  }

  // آسمان
  const skyGeo = new THREE.SphereGeometry(120, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x050515, side: THREE.BackSide });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  parent.add(sky);

  // ماه
  const moon = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xeeeedd }));
  moon.position.set(25, 35, -60);
  parent.add(moon);

  // ستاره‌ها
  const starsGeo = new THREE.BufferGeometry();
  const starPositions = [];
  for (let i = 0; i < 200; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.5;
    const r = 100;
    starPositions.push(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi) + 20,
      r * Math.sin(phi) * Math.sin(theta) - 30
    );
  }
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
  parent.add(new THREE.Points(starsGeo, starsMat));
}

// ===== ذرات گرد و غبار =====
function createDustParticles() {
  const count = 300;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 10;
    positions[i * 3 + 1] = 0.2 + Math.random() * 2.6;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
    velocities.push({
      x: (Math.random() - 0.5) * 0.003,
      y: (Math.random() - 0.5) * 0.001,
      z: (Math.random() - 0.5) * 0.003
    });
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: 0xffffff, size: 0.015, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  const ps = new THREE.Points(geometry, material);
  ps.userData.velocities = velocities;
  scene.add(ps);
  particles.push(ps);
}

// ===== رویدادها =====
function setupEvents() {
  document.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if (e.code === 'KeyF' && playerState.gameStarted) {
      playerState.flashlightOn = !playerState.flashlightOn;
    }
    if (e.code === 'KeyH' && playerState.gameStarted) {
      document.getElementById('smartphone').classList.toggle('active');
    }
    if (e.code === 'KeyE' && currentInteractable) {
      handleInteraction(currentInteractable);
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });
  
  document.addEventListener('mousemove', e => {
    if (isPointerLocked) {
      mouseMovement.x += e.movementX;
      mouseMovement.y += e.movementY;
    }
  });

  document.addEventListener('pointerlockchange', () => {
    isPointerLocked = document.pointerLockElement === document.getElementById('gameCanvas');
  });

  document.getElementById('gameCanvas').addEventListener('click', () => {
    if (playerState.gameStarted && !isPointerLocked) {
      document.getElementById('gameCanvas').requestPointerLock();
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ===== تعامل =====
function handleInteraction(item) {
  if (item.type === 'cabinet') {
    addPhoneMessage('سیستم', 'کابینت خالی است. چیزی پیدا نشد.');
  } else if (item.type === 'fridge') {
    addPhoneMessage('سیستم', 'یخچال تقریباً خالی است. یک بطری آب پیدا کردی!');
    playerState.health = Math.min(100, playerState.health + 5);
  }
}

// ===== بررسی ذخیره =====
function checkSaveData() {
  const saveData = localStorage.getItem('tower30_save');
  if (saveData) {
    document.getElementById('continueBtn').style.display = 'block';
  }
}

// ===== شروع بازی جدید =====
window.startNewGame = function() {
  document.getElementById('startMenu').style.display = 'none';
  showLoading();
  
  setTimeout(() => {
    playerState.gameStarted = true;
    playerState.inCasualClothes = true;
    playerState.health = 100;
    playerState.stamina = 100;
    playerState.floor = 30;
    playerState.gameTime = 0;
    camera.position.set(0, 1.7, 2);
    
    document.getElementById('gameCanvas').requestPointerLock();
    
    setTimeout(() => addPhoneMessage('ناشناس', 'بیدار شو... وقت نداریم. برق تا ۴ ساعت دیگه قطع میشه.'), 1000);
    setTimeout(() => addPhoneMessage('ناشناس', 'سگت شرمَن کنارته. مراقبش باش.'), 4000);
    setTimeout(() => addPhoneMessage('ناشناس', 'از پله‌ها بیا پایین. طبقه به طبقه. مراقب صدا باش.'), 7000);
    setTimeout(() => addPhoneMessage('ناشناس', 'لباس رزمیت توی کمد اتاق خوابه. عجله کن.'), 10000);
    
    hideLoading();
  }, 2000);
};

// ===== ادامه بازی =====
window.continueGame = function() {
  const saveData = JSON.parse(localStorage.getItem('tower30_save'));
  if (saveData) {
    playerState.health = saveData.health || 100;
    playerState.stamina = saveData.stamina || 100;
    playerState.floor = saveData.floor || 30;
    playerState.gameTime = saveData.gameTime || 0;
    playerState.inCasualClothes = saveData.inCasualClothes !== undefined ? saveData.inCasualClothes : true;
    if (saveData.position) {
      camera.position.set(saveData.position[0], saveData.position[1], saveData.position[2]);
    }
  }
  document.getElementById('startMenu').style.display = 'none';
  playerState.gameStarted = true;
  document.getElementById('gameCanvas').requestPointerLock();
  document.getElementById('floorInfo').textContent = `طبقه ${playerState.floor}`;
};

// ===== لودینگ =====
function showLoading() {
  const ls = document.getElementById('loadingScreen');
  ls.style.display = 'flex';
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 20;
    if (progress >= 100) { progress = 100; clearInterval(interval); }
    document.getElementById('loadingBarFill').style.width = progress + '%';
  }, 150);
}

function hideLoading() {
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
  }, 400);
}

// ===== پیام گوشی =====
function addPhoneMessage(sender, text) {
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  
  const msgDiv = document.createElement('div');
  msgDiv.className = 'phone-msg';
  msgDiv.innerHTML = `<div class="sender">${sender} — ${timeStr}</div><div class="text">${text}</div>`;
  
  const container = document.getElementById('phoneMessages');
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;
  
  document.getElementById('phoneTime').textContent = timeStr;
  document.getElementById('smartphone').classList.add('active');
}

// ===== به‌روزرسانی بازیکن =====
function updatePlayer(delta) {
  if (!playerState.gameStarted) return;

  const sensitivity = 0.002;
  playerState.rotation = playerState.rotation || new THREE.Euler(0, 0, 0, 'YXZ');
  playerState.rotation.y -= mouseMovement.x * sensitivity;
  playerState.rotation.x -= mouseMovement.y * sensitivity;
  playerState.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, playerState.rotation.x));
  mouseMovement.x = 0;
  mouseMovement.y = 0;

  camera.rotation.copy(playerState.rotation);

  const speed = (keys['ShiftLeft'] && playerState.stamina > 0) ? 6 : 3.5;
  const direction = new THREE.Vector3();
  
  if (keys['KeyW']) direction.z -= 1;
  if (keys['KeyS']) direction.z += 1;
  if (keys['KeyA']) direction.x -= 1;
  if (keys['KeyD']) direction.x += 1;
  
  direction.normalize();
  direction.applyEuler(new THREE.Euler(0, playerState.rotation.y, 0));
  
  camera.position.x += direction.x * speed * delta;
  camera.position.z += direction.z * speed * delta;

  // محدودیت
  camera.position.x = Math.max(-5.5, Math.min(5.5, camera.position.x));
  camera.position.z = Math.max(-4.5, Math.min(4.5, camera.position.z));

  // Camera Bob
  if (direction.length() > 0) {
    const bobSpeed = keys['ShiftLeft'] ? 10 : 7;
    const bobAmount = keys['ShiftLeft'] ? 0.04 : 0.025;
    camera.position.y = 1.7 + Math.sin(clock.elapsedTime * bobSpeed) * bobAmount;
  } else {
    camera.position.y = 1.7;
  }

  // استامینا
  if (keys['ShiftLeft'] && direction.length() > 0) {
    playerState.stamina = Math.max(0, playerState.stamina - 15 * delta);
  } else {
    playerState.stamina = Math.min(100, playerState.stamina + 12 * delta);
  }

  // چراغ‌قوه
  flashlight.visible = playerState.flashlightOn;
  if (playerState.flashlightOn) {
    flashlight.position.copy(camera.position);
    const dir = new THREE.Vector3(0, 0, -1);
    dir.applyQuaternion(camera.quaternion);
    flashlightTarget.position.copy(camera.position).add(dir.multiplyScalar(5));
  }

  // بررسی تعامل
  checkInteractions();

  // HUD
  document.querySelector('#healthBar .hud-bar-fill').style.width = playerState.health + '%';
  document.querySelector('#staminaBar .hud-bar-fill').style.width = playerState.stamina + '%';

  // ساعت
  playerState.gameTime += delta;
  const mins = Math.floor(playerState.gameTime / 60);
  const secs = Math.floor(playerState.gameTime % 60);
  document.getElementById('gameClock').textContent = 
    `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

  // ذخیره
  if (Math.floor(playerState.gameTime) > 0 && Math.floor(playerState.gameTime) % 30 === 0) {
    saveGame();
  }
}

// ===== بررسی تعامل =====
function checkInteractions() {
  const raycaster = new THREE.Raycaster();
  const center = new THREE.Vector2(0, 0);
  raycaster.setFromCamera(center, camera);
  
  let found = null;
  let minDist = 3;
  
  interactables.forEach(item => {
    const intersects = raycaster.intersectObject(item.mesh);
    if (intersects.length > 0 && intersects[0].distance < minDist) {
      found = item;
      minDist = intersects[0].distance;
    }
  });
  
  currentInteractable = found;
  const prompt = document.getElementById('interactionPrompt');
  if (found) {
    prompt.textContent = found.label;
    prompt.style.opacity = '1';
  } else {
    prompt.style.opacity = '0';
  }
}

// ===== ذخیره =====
function saveGame() {
  const saveData = {
    health: playerState.health,
    stamina: playerState.stamina,
    floor: playerState.floor,
    gameTime: playerState.gameTime,
    inCasualClothes: playerState.inCasualClothes,
    position: [camera.position.x, camera.position.y, camera.position.z]
  };
  localStorage.setItem('tower30_save', JSON.stringify(saveData));
}

// ===== به‌روزرسانی ذرات =====
function updateParticles(delta) {
  particles.forEach(ps => {
    const positions = ps.geometry.attributes.position.array;
    const vels = ps.userData.velocities;
    
    for (let i = 0; i < vels.length; i++) {
      positions[i * 3] += vels[i].x;
      positions[i * 3 + 1] += vels[i].y;
      positions[i * 3 + 2] += vels[i].z;
      
      if (Math.abs(positions[i * 3]) > 5.5) positions[i * 3] *= -0.9;
      if (positions[i * 3 + 1] > 2.8 || positions[i * 3 + 1] < 0.1) vels[i].y *= -1;
      if (Math.abs(positions[i * 3 + 2]) > 4.5) positions[i * 3 + 2] *= -0.9;
    }
    
    ps.geometry.attributes.position.needsUpdate = true;
  });
}

// ===== حلقه اصلی =====
function animate() {
  requestAnimationFrame(animate);
  
  const delta = Math.min(clock.getDelta(), 0.05);
  
  updatePlayer(delta);
  updateParticles(delta);
  
  composer.passes.forEach(pass => {
    if (pass.uniforms && pass.uniforms.time) {
      pass.uniforms.time.value = clock.elapsedTime;
    }
  });
  
  composer.render();
}

// ===== شروع =====
initEngine();
animate();

</script>
