<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برج ۳۰ - فاز ۱ | Survival Horror</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #blocker {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #e0e0e0; z-index: 100; cursor: pointer;
  }
  #blocker h1 { font-size: 2.8rem; margin-bottom: 12px; letter-spacing: 4px; color: #ff4444; }
  #blocker p { font-size: 1.1rem; opacity: 0.7; margin-bottom: 30px; }
  #instructions { text-align: center; line-height: 1.8; }
  #fps { position: absolute; top: 12px; left: 12px; color: #0f0; font-size: 14px; z-index: 50; }
  #phone-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    color: #aaa; font-size: 13px; opacity: 0.6; z-index: 50; }
</style>
</head>
<body>
<div id="blocker">
  <h1>برج ۳۰</h1>
  <p>طبقه سی‌ام • ساعت ۲۳:۴۷</p>
  <div id="instructions">
    کلیک کن تا وارد شی<br>
    حرکت: WASD • نگاه: ماوس • چراغ‌قوه: F (فاز ۲)<br>
    <small style="opacity:0.5">فاز ۱ – موتور گرافیکی + آپارتمان + گوشی</small>
  </div>
</div>
<div id="fps">FPS: --</div>
<div id="phone-hint">گوشی رو با ماوس حرکت بده • پیام‌ها خودکار می‌آن</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ==================== تنظیمات اصلی ====================
const CONFIG = {
  shadowMapSize: 2048,        // برای ۶۰fps روی اکثر سیستم‌ها (می‌تونی ۴۰۹۶ کنی اگر قوی داری)
  enableHeavyPost: true,
  fogDensity: 0.018
};

let scene, camera, renderer, composer;
let clock = new THREE.Clock();
let fpsFrames = 0, fpsLast = performance.now();
let phoneMesh, phoneScreenCanvas, phoneCtx;
let pointerLocked = false;
let mouseX = 0, mouseY = 0;
let lookX = 0, lookY = 0;
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();
const keys = {};

// ذخیره و بارگذاری ساده برای ادامه بازی
const SAVE_KEY = 'tower30_save_v1';
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveGame(data) {
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

// ==================== راه‌اندازی موتور ====================
function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1a1a22, CONFIG.fogDensity);
  scene.background = new THREE.Color(0x0a0a12);

  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
  camera.position.set(0, 1.65, 4); // داخل آپارتمان

  renderer = new THREE.WebGLRenderer({
    antialias: false, // SMAA خودش انجام می‌ده
    powerPreference: 'high-performance',
    stencil: false
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // محدودیت برای FPS
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // نورپردازی سینمایی
  setupLighting();
  buildApartment();
  createPhone();
  setupPostProcessing();
  setupControls();

  // بارگذاری ذخیره (اگر وجود داشت)
  const save = loadSave();
  if (save) {
    camera.position.fromArray(save.pos);
    lookX = save.lookX || 0;
    lookY = save.lookY || 0;
    console.log('ادامه از آخرین نقطه ذخیره شده...');
  }

  animate();
}

// ==================== نورپردازی ====================
function setupLighting() {
  // نور ملایم آسمان + زمین
  const hemi = new THREE.HemisphereLight(0x445566, 0x221100, 0.35);
  scene.add(hemi);

  // نور اصلی پنجره (غروب)
  const windowLight = new THREE.DirectionalLight(0xff9966, 1.8);
  windowLight.position.set(-8, 6, -12);
  windowLight.castShadow = true;
  windowLight.shadow.mapSize.set(CONFIG.shadowMapSize, CONFIG.shadowMapSize);
  windowLight.shadow.camera.near = 1;
  windowLight.shadow.camera.far = 40;
  windowLight.shadow.camera.left = -12;
  windowLight.shadow.camera.right = 12;
  windowLight.shadow.camera.top = 10;
  windowLight.shadow.camera.bottom = -6;
  windowLight.shadow.bias = -0.0003;
  scene.add(windowLight);

  // نورهای نقطه‌ای داخل آپارتمان (لامپ‌های کم‌نور)
  const lamp1 = new THREE.PointLight(0xffaa77, 1.4, 8, 1.8);
  lamp1.position.set(2.2, 2.4, 1.5);
  lamp1.castShadow = true;
  lamp1.shadow.mapSize.set(1024, 1024);
  scene.add(lamp1);

  const lamp2 = new THREE.PointLight(0x88aacc, 0.6, 6, 2);
  lamp2.position.set(-2.5, 2.1, -1.8);
  scene.add(lamp2);

  // نور خیلی ضعیف از بیرون شهر
  const cityGlow = new THREE.PointLight(0x334466, 0.4, 30);
  cityGlow.position.set(0, 5, -25);
  scene.add(cityGlow);
}

// ==================== ساخت آپارتمان طبقه ۳۰ ====================
function buildApartment() {
  // کف
  const floorMat = new THREE.MeshPhysicalMaterial({
    color: 0x3a342e,
    roughness: 0.75,
    metalness: 0.05,
    clearcoat: 0.15,
    clearcoatRoughness: 0.4
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 12), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // دیوارها
  const wallMat = new THREE.MeshPhysicalMaterial({
    color: 0x4a453f,
    roughness: 0.85,
    metalness: 0.02
  });

  // دیوار عقب (با پنجره)
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(14, 3.2, 0.25), wallMat);
  backWall.position.set(0, 1.6, -6);
  backWall.receiveShadow = true;
  backWall.castShadow = true;
  scene.add(backWall);

  // دیوار جلو
  const frontWall = new THREE.Mesh(new THREE.BoxGeometry(14, 3.2, 0.25), wallMat);
  frontWall.position.set(0, 1.6, 6);
  frontWall.receiveShadow = true;
  scene.add(frontWall);

  // دیوارهای جانبی
  const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.2, 12), wallMat);
  sideL.position.set(-7, 1.6, 0);
  sideL.receiveShadow = true;
  scene.add(sideL);

  const sideR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.2, 12), wallMat);
  sideR.position.set(7, 1.6, 0);
  sideR.receiveShadow = true;
  scene.add(sideR);

  // سقف
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(14, 12), new THREE.MeshStandardMaterial({ color: 0x2a2825, roughness: 0.9 }));
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = 3.2;
  ceiling.receiveShadow = true;
  scene.add(ceiling);

  // پنجره بزرگ
  const windowFrame = new THREE.Mesh(
    new THREE.BoxGeometry(5.5, 2.2, 0.15),
    new THREE.MeshPhysicalMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 })
  );
  windowFrame.position.set(0, 1.7, -5.9);
  scene.add(windowFrame);

  // شیشه پنجره (با کمی transmission)
  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(5.1, 1.9),
    new THREE.MeshPhysicalMaterial({
      color: 0x88aacc,
      transmission: 0.75,
      opacity: 0.35,
      transparent: true,
      roughness: 0.05,
      metalness: 0.1,
      ior: 1.5
    })
  );
  glass.position.set(0, 1.7, -5.85);
  scene.add(glass);

  // شهر بیرون (سیلوئت ساده)
  createCitySilhouette();

  // مبلمان ساده اما با متریال خوب
  // تخت
  const bedFrame = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.4, 1.4),
    new THREE.MeshPhysicalMaterial({ color: 0x2a2218, roughness: 0.6, metalness: 0.1 })
  );
  bedFrame.position.set(-4, 0.25, -2.5);
  bedFrame.castShadow = true;
  bedFrame.receiveShadow = true;
  scene.add(bedFrame);

  const mattress = new THREE.Mesh(
    new THREE.BoxGeometry(2.1, 0.25, 1.3),
    new THREE.MeshPhysicalMaterial({ color: 0x5a4a3a, roughness: 0.9, clearcoat: 0.1 })
  );
  mattress.position.set(-4, 0.55, -2.5);
  mattress.castShadow = true;
  scene.add(mattress);

  // میز کنار تخت
  const nightstand = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.55, 0.45),
    new THREE.MeshPhysicalMaterial({ color: 0x3a3228, roughness: 0.55, metalness: 0.15 })
  );
  nightstand.position.set(-5.4, 0.3, -2.5);
  nightstand.castShadow = true;
  scene.add(nightstand);

  // لامپ روی میز
  const lampBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.12, 0.15, 12),
    new THREE.MeshPhysicalMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 })
  );
  lampBase.position.set(-5.4, 0.65, -2.5);
  scene.add(lampBase);

  // کابینت
  const cabinet = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.1, 0.5),
    new THREE.MeshPhysicalMaterial({ color: 0x3d352c, roughness: 0.7 })
  );
  cabinet.position.set(4.5, 0.55, -4.5);
  cabinet.castShadow = true;
  scene.add(cabinet);

  // درب خروجی به راهرو (فعلاً بسته)
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 2.3, 0.12),
    new THREE.MeshPhysicalMaterial({ color: 0x4a3a2a, roughness: 0.65, metalness: 0.05 })
  );
  door.position.set(5.5, 1.15, 5.9);
  door.castShadow = true;
  scene.add(door);

  // ذرات گرد و غبار خیلی سبک
  createDustParticles();
}

function createCitySilhouette() {
  const cityGroup = new THREE.Group();
  const buildingMat = new THREE.MeshBasicMaterial({ color: 0x111118 });
  for (let i = 0; i < 25; i++) {
    const h = 4 + Math.random() * 18;
    const w = 1.2 + Math.random() * 2.5;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), buildingMat);
    b.position.set(
      (Math.random() - 0.5) * 40,
      h / 2 - 2,
      -18 - Math.random() * 25
    );
    cityGroup.add(b);
  }
  // نورهای شهر
  for (let i = 0; i < 40; i++) {
    const light = new THREE.PointLight(0xffaa66, 0.15 + Math.random() * 0.25, 8);
    light.position.set(
      (Math.random() - 0.5) * 35,
      2 + Math.random() * 12,
      -15 - Math.random() * 20
    );
    cityGroup.add(light);
  }
  scene.add(cityGroup);
}

function createDustParticles() {
  const count = 180;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 12;
    positions[i * 3 + 1] = Math.random() * 3;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xccbb99,
    size: 0.025,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });
  const dust = new THREE.Points(geo, mat);
  scene.add(dust);
  // انیمیشن ساده در حلقه
  dust.userData.isDust = true;
}

// ==================== گوشی هوشمند (Diegetic UI) ====================
function createPhone() {
  // قاب گوشی
  phoneMesh = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.09, 0.18, 0.012),
    new THREE.MeshPhysicalMaterial({
      color: 0x1a1a1a,
      metalness: 0.6,
      roughness: 0.25,
      clearcoat: 0.8
    })
  );
  phoneMesh.add(body);

  // صفحه
  phoneScreenCanvas = document.createElement('canvas');
  phoneScreenCanvas.width = 360;
  phoneScreenCanvas.height = 720;
  phoneCtx = phoneScreenCanvas.getContext('2d');
  drawPhoneScreen('در حال اتصال...');

  const screenTex = new THREE.CanvasTexture(phoneScreenCanvas);
  screenTex.colorSpace = THREE.SRGBColorSpace;
  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(0.082, 0.164),
    new THREE.MeshBasicMaterial({ map: screenTex })
  );
  screen.position.z = 0.007;
  phoneMesh.add(screen);

  phoneMesh.position.set(-0.28, -0.22, -0.45);
  phoneMesh.rotation.set(0.15, 0.35, 0.08);
  camera.add(phoneMesh);
  scene.add(camera);

  // پیام‌های اولیه
  setTimeout(() => drawPhoneScreen('پیام ناشناس:\n\nتو هنوز اونجایی؟\nبرق تا ۴ ساعت دیگه می‌ره.\nسگ رو نزدیک نگه دار.'), 2500);
  setTimeout(() => drawPhoneScreen('پیام ناشناس:\n\nطبقه ۳۰ امن نیست.\nبرو پایین.\nهر صدایی خطرناکه.'), 8000);
  setTimeout(() => drawPhoneScreen('پیام ناشناس:\n\nمن کمکت می‌کنم.\nولی فقط اگر ساکت باشی.\n\n— ؟'), 14000);
}

function drawPhoneScreen(text) {
  const ctx = phoneCtx;
  const w = phoneScreenCanvas.width;
  const h = phoneScreenCanvas.height;

  // پس‌زمینه تیره
  ctx.fillStyle = '#0d0d12';
  ctx.fillRect(0, 0, w, h);

  // نوار وضعیت
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(0, 0, w, 48);
  ctx.fillStyle = '#888';
  ctx.font = '18px system-ui';
  ctx.fillText('۲۳:۴۷', 20, 32);
  ctx.fillText('۴۲٪', w - 70, 32);

  // متن پیام
  ctx.fillStyle = '#e8e8e8';
  ctx.font = '22px system-ui';
  const lines = text.split('\n');
  let y = 110;
  lines.forEach(line => {
    ctx.fillText(line, 30, y);
    y += 36;
  });

  // نشانگر پایین
  ctx.fillStyle = '#333';
  ctx.fillRect(w / 2 - 40, h - 28, 80, 6);

  if (phoneMesh) {
    phoneMesh.children[1].material.map.needsUpdate = true;
  }
}

// ==================== پس‌پردازش سنگین ====================
function setupPostProcessing() {
  composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  if (CONFIG.enableHeavyPost) {
    // SSAO
    const ssaoPass = new SSAOPass(scene, camera, innerWidth, innerHeight);
    ssaoPass.kernelRadius = 12;
    ssaoPass.minDistance = 0.001;
    ssaoPass.maxDistance = 0.08;
    composer.addPass(ssaoPass);

    // Bloom
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.45,  // strength
      0.6,   // radius
      0.85   // threshold
    );
    composer.addPass(bloomPass);

    // عمق میدان سینمایی
    const bokehPass = new BokehPass(scene, camera, {
      focus: 4.5,
      aperture: 0.00022,
      maxblur: 0.008
    });
    composer.addPass(bokehPass);

    // SMAA
    const smaaPass = new SMAAPass();
    composer.addPass(smaaPass);
  }

  // شیدر سفارشی: Chromatic + Grain + Vignette
  const customShader = {
    uniforms: {
      tDiffuse: { value: null },
      time: { value: 0 },
      chromatic: { value: 0.0028 },
      grain: { value: 0.045 },
      vignette: { value: 0.55 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float time;
      uniform float chromatic;
      uniform float grain;
      uniform float vignette;
      varying vec2 vUv;

      float random(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
      }

      void main() {
        vec2 uv = vUv;
        float r = texture2D(tDiffuse, uv + vec2(chromatic, 0.0)).r;
        float g = texture2D(tDiffuse, uv).g;
        float b = texture2D(tDiffuse, uv - vec2(chromatic, 0.0)).b;
        vec3 col = vec3(r, g, b);

        // Film grain
        float noise = random(uv * time) * grain;
        col += noise - grain * 0.5;

        // Vignette
        float dist = distance(uv, vec2(0.5));
        col *= smoothstep(0.85, 0.25, dist * vignette + 0.3);

        gl_FragColor = vec4(col, 1.0);
      }
    `
  };
  const customPass = new ShaderPass(customShader);
  composer.addPass(customPass);

  // Output
  composer.addPass(new OutputPass());

  // نگه داشتن رفرنس برای آپدیت time
  window._customPass = customPass;
}

// ==================== کنترل‌ها ====================
function setupControls() {
  const blocker = document.getElementById('blocker');
  blocker.addEventListener('click', () => {
    document.body.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === document.body;
    blocker.style.display = pointerLocked ? 'none' : 'flex';
  });

  document.addEventListener('mousemove', (e) => {
    if (!pointerLocked) return;
    lookX -= e.movementX * 0.0022;
    lookY -= e.movementY * 0.0022;
    lookY = Math.max(-1.4, Math.min(1.4, lookY));
  });

  document.addEventListener('keydown', (e) => { keys[e.code] = true; });
  document.addEventListener('keyup', (e) => { keys[e.code] = false; });

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}

// ==================== حلقه اصلی ====================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // حرکت ساده بازیکن (فاز ۱)
  if (pointerLocked) {
    direction.set(0, 0, 0);
    if (keys['KeyW']) direction.z -= 1;
    if (keys['KeyS']) direction.z += 1;
    if (keys['KeyA']) direction.x -= 1;
    if (keys['KeyD']) direction.x += 1;
    direction.normalize();

    const speed = keys['ShiftLeft'] ? 4.2 : 2.4;
    velocity.x = direction.x * speed;
    velocity.z = direction.z * speed;

    // چرخش دوربین با اینرسی ملایم
    camera.rotation.order = 'YXZ';
    camera.rotation.y = lookX;
    camera.rotation.x = lookY;

    // حرکت در جهت نگاه
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();

    camera.position.addScaledVector(forward, -velocity.z * dt);
    camera.position.addScaledVector(right, velocity.x * dt);

    // محدودیت داخل آپارتمان
    camera.position.x = Math.max(-6.2, Math.min(6.2, camera.position.x));
    camera.position.z = Math.max(-5.3, Math.min(5.3, camera.position.z));
    camera.position.y = 1.65;

    // لرزش خیلی ملایم دوربین (Camera Bob سبک)
    if (direction.length() > 0.1) {
      camera.position.y += Math.sin(t * 9) * 0.012;
    }
  }

  // آپدیت شیدر سفارشی
  if (window._customPass) {
    window._customPass.uniforms.time.value = t;
  }

  // ذرات گرد و غبار
  scene.traverse(obj => {
    if (obj.userData.isDust) {
      const pos = obj.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.array[i * 3 + 1] += Math.sin(t + i) * 0.0008;
        if (pos.array[i * 3 + 1] > 3.1) pos.array[i * 3 + 1] = 0.1;
      }
      pos.needsUpdate = true;
    }
  });

  // ذخیره خودکار هر ۳۰ ثانیه
  if (Math.floor(t) % 30 === 0 && Math.floor(t) !== window._lastSave) {
    window._lastSave = Math.floor(t);
    saveGame({
      pos: camera.position.toArray(),
      lookX, lookY,
      time: Date.now()
    });
  }

  // FPS
  fpsFrames++;
  if (performance.now() - fpsLast > 1000) {
    document.getElementById('fps').textContent = `FPS: ${fpsFrames}`;
    fpsFrames = 0;
    fpsLast = performance.now();
  }

  composer.render();
}
